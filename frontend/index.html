<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230c0c0c'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Arial Black,sans-serif' font-weight='900' font-size='18' fill='%236c63ff'%3ETAP%3C/text%3E%3C/svg%3E"/>
<title>TAP — AI Router</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
:root{
  --bg:#0c0c0c;--surface:#161616;--surface2:#1e1e1e;--surface3:#282828;--border:#2a2a2a;
  --text:#e8e6e1;--text2:#9a9890;--text3:#555;--accent:#6c63ff;--green:#4ecdc4;--red:#ff6b6b;
  --anthropic:#D97757;--google:#4285F4;--meta:#0668E1;--deepseek:#536DFE;
  --mistral:#FF7000;--qwen:#6F42C1;--openrouter:#9a9890;
  --r:8px;--r2:12px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Roboto',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}

/* Sidebar */
.sidebar{width:256px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:width .22s ease}
.sidebar.closed{width:0;border:none;overflow:hidden}
.sidebar-header{padding:13px 12px 10px;border-bottom:1px solid var(--border);flex-shrink:0}
.logo-row{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.logo-mark{width:28px;height:28px;border-radius:7px;flex-shrink:0;background:linear-gradient(135deg,#6c63ff,#4ecdc4);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff}
.logo-name{font-size:17px;font-weight:700;letter-spacing:-.5px}.logo-name span{color:var(--accent)}
.logo-sub{font-size:10px;color:var(--text3);margin-top:1px}
.new-chat-btn{width:100%;padding:9px 12px;border-radius:var(--r);border:1px dashed var(--border);background:transparent;color:var(--text2);font-size:13px;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .18s}
.new-chat-btn:hover{background:var(--surface2);border-color:var(--accent);color:var(--text)}
.sec-label{padding:11px 12px 5px;font-size:11px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--text3);flex-shrink:0}
.chat-list{flex:1;overflow-y:auto;padding:0 5px 8px}
.chat-item{padding:8px 9px;border-radius:var(--r);cursor:pointer;margin-bottom:1px;display:flex;align-items:center;gap:7px;transition:background .13s}
.chat-item:hover{background:var(--surface2)}.chat-item.active{background:var(--surface3)}
.chat-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0}
.chat-info{flex:1;min-width:0}
.chat-title{font-size:14px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.chat-meta{font-size:11px;color:var(--text3);margin-top:1px}
.chat-del{opacity:0;padding:2px 5px;border-radius:4px;border:none;background:transparent;color:var(--text3);cursor:pointer;font-size:11px;flex-shrink:0;transition:opacity .13s,color .13s}
.chat-item:hover .chat-del{opacity:1}.chat-del:hover{color:var(--red)}
.keys-panel{border-top:1px solid var(--border);flex-shrink:0;max-height:320px;overflow-y:auto;margin-top:auto}
.keys-toggle{width:100%;padding:10px 12px;border:none;background:transparent;color:var(--text2);font-size:11px;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:space-between;text-align:left;transition:color .15s}
.keys-toggle:hover{color:var(--text)}
.keys-body{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.provider-key{display:flex;flex-direction:column;gap:4px}
.prov-label-row{display:flex;align-items:center;justify-content:space-between}
.prov-name{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px}
.prov-status{font-size:9px;padding:2px 6px;border-radius:20px;font-weight:500}
.prov-status.saved{background:rgba(78,205,196,.12);color:var(--green)}
.prov-status.unset{background:rgba(255,255,255,.06);color:var(--text3)}
.key-row{display:flex;gap:5px}
.key-inp{flex:1;padding:6px 8px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:11px;font-family:'JetBrains Mono',monospace;outline:none;min-width:0}
.key-inp::placeholder{color:var(--text3)}.key-inp:focus{border-color:var(--accent)}
.key-save{padding:6px 9px;border-radius:var(--r);border:none;background:var(--accent);color:#fff;font-size:11px;cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0;transition:.15s}
.key-save:hover{background:#5a52e0}
.key-clear{padding:6px 9px;border-radius:var(--r);border:1px solid var(--border);background:transparent;color:var(--text3);font-size:11px;cursor:pointer;font-family:inherit;flex-shrink:0;transition:.15s}
.key-clear:hover{color:var(--red);border-color:rgba(255,107,107,.4)}
.key-mask{flex:1;padding:6px 8px;border-radius:var(--r);background:var(--surface2);border:1px solid var(--border);font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--text3)}
.key-hint{font-size:9px;color:var(--text3)}
.key-icon-btn{width:30px;height:30px;border-radius:var(--r);border:1px solid var(--border);background:transparent;color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0;font-size:13px}
.key-icon-btn:hover{background:var(--surface2);color:var(--text)}
.key-icon-btn.del:hover{color:var(--red);border-color:rgba(255,107,107,.4)}
.key-icon-btn.edit:hover{color:var(--accent);border-color:var(--accent)}
.del-confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s ease}
.del-confirm-card{width:340px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);box-shadow:0 24px 80px rgba(0,0,0,.6);animation:popIn .22s ease;padding:24px;text-align:center}
.del-confirm-card h3{font-size:15px;font-weight:700;color:var(--text);margin-bottom:8px}
.del-confirm-card p{font-size:12px;color:var(--text2);margin-bottom:14px;line-height:1.5}
.del-confirm-card input{width:100%;padding:10px 12px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:13px;font-family:'JetBrains Mono',monospace;outline:none;text-align:center;margin-bottom:12px}
.del-confirm-card input:focus{border-color:var(--red)}
.del-confirm-card input::placeholder{color:var(--text3)}
.del-confirm-btns{display:flex;gap:8px}
.del-confirm-btns button{flex:1;padding:10px;border-radius:var(--r);border:none;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
.del-confirm-btns .del-cancel{background:var(--surface2);border:1px solid var(--border);color:var(--text2)}
.del-confirm-btns .del-cancel:hover{border-color:var(--text3);color:var(--text)}
.del-confirm-btns .del-go{background:var(--red);color:#fff;opacity:.4;cursor:not-allowed}
.del-confirm-btns .del-go.enabled{opacity:1;cursor:pointer}
.del-confirm-btns .del-go.enabled:hover{background:#e55a5a}

/* Main */
.main-col{flex:1;display:flex;flex-direction:column;overflow:hidden}
.hdr{padding:10px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--surface);flex-shrink:0;flex-wrap:wrap}
.hdr-left{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.sidebar-toggle{width:30px;height:30px;border-radius:var(--r);border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;transition:.15s}
.sidebar-toggle:hover{background:var(--surface2);color:var(--text)}
.tabs{display:flex;gap:3px}
.tab{background:none;border:none;color:var(--text3);font-family:inherit;font-size:13px;font-weight:500;padding:5px 12px;border-radius:7px;cursor:pointer;transition:.15s}
.tab:hover{color:var(--text2)}.tab.on{background:var(--accent);color:#fff}
.model-pick-btn{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:var(--r2);border:1px solid var(--border);background:var(--surface2);cursor:pointer;font-family:inherit;color:var(--text);font-size:13px;font-weight:500;flex-shrink:0;transition:all .18s;white-space:nowrap}
.model-pick-btn:hover{border-color:var(--text3);background:var(--surface3)}
.pick-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}.pick-arrow{font-size:10px;color:var(--text3);margin-left:2px}

/* User/Profile button */
.user-btn{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:var(--r);border:1px solid var(--border);background:transparent;color:var(--text2);font-size:11px;font-family:inherit;cursor:pointer;transition:.15s;flex-shrink:0}
.user-btn:hover{background:var(--surface2);border-color:var(--accent);color:var(--text)}
.user-av{width:24px;height:24px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
.user-dropdown{position:absolute;top:52px;right:18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);box-shadow:0 12px 40px rgba(0,0,0,.5);min-width:220px;z-index:90;animation:popIn .18s ease;overflow:hidden}
.ud-header{padding:14px 16px;border-bottom:1px solid var(--border)}
.ud-name{font-size:13px;font-weight:600;color:var(--text)}
.ud-email{font-size:11px;color:var(--text3);margin-top:2px}
.ud-item{padding:10px 16px;font-size:12px;color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:8px;transition:.13s}
.ud-item:hover{background:var(--surface2);color:var(--text)}
.ud-item.danger{color:var(--red)}.ud-item.danger:hover{background:rgba(255,107,107,.08)}

/* Auth modal */
.auth-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s ease}
.auth-card{width:380px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);box-shadow:0 24px 80px rgba(0,0,0,.6);animation:popIn .22s ease;overflow:hidden}
.auth-header{padding:24px 28px 16px;text-align:center}
.auth-logo{font-size:28px;font-weight:800;letter-spacing:-1px;margin-bottom:4px}.auth-logo span{color:var(--accent)}
.auth-sub{font-size:12px;color:var(--text3)}
.auth-tabs{display:flex;border-bottom:1px solid var(--border)}
.auth-tab{flex:1;padding:10px;text-align:center;font-size:12px;font-weight:600;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:.15s}
.auth-tab:hover{color:var(--text2)}.auth-tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.auth-body{padding:20px 28px 24px}
.auth-field{margin-bottom:14px}
.auth-label{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:5px;display:block}
.auth-input{width:100%;padding:11px 14px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:14px;font-family:inherit;outline:none}
.auth-input:focus{border-color:var(--accent)}
.auth-input::placeholder{color:var(--text3)}
.auth-submit{width:100%;padding:12px;border-radius:var(--r);border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;margin-top:6px}
.auth-submit:hover{background:#5a52e0}
.auth-submit:disabled{opacity:.5;cursor:not-allowed}
.auth-err{font-size:11px;color:var(--red);margin-top:8px;min-height:16px}
.auth-skip{text-align:center;margin-top:12px;font-size:11px;color:var(--text3)}
.auth-skip a{color:var(--accent);cursor:pointer;text-decoration:none}.auth-skip a:hover{text-decoration:underline}
.auth-close{position:absolute;top:12px;right:14px;background:none;border:none;color:var(--text3);font-size:16px;cursor:pointer;padding:4px 8px;border-radius:4px;transition:.15s}
.auth-close:hover{color:var(--text);background:var(--surface2)}

/* Profile edit modal */
.profile-card{width:360px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);box-shadow:0 24px 80px rgba(0,0,0,.6);animation:popIn .22s ease;overflow:hidden}
.profile-header{padding:20px 24px 14px;border-bottom:1px solid var(--border);font-size:14px;font-weight:700}
.profile-body{padding:20px 24px}
.profile-save{width:100%;padding:10px;border-radius:var(--r);border:none;background:var(--accent);color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:10px;transition:.15s}
.profile-save:hover{background:#5a52e0}

/* Login gate banner */
.login-gate{padding:12px 16px;background:rgba(108,99,255,.08);border:1px solid rgba(108,99,255,.2);border-radius:var(--r);font-size:12px;color:var(--text2);text-align:center;margin:8px auto;max-width:840px}
.login-gate a{color:var(--accent);cursor:pointer;font-weight:600;text-decoration:none}.login-gate a:hover{text-decoration:underline}

/* Model picker */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:flex-start;justify-content:flex-end;padding:56px 18px 0 0;animation:fadeIn .18s ease}
.model-picker{width:380px;max-height:calc(100vh - 80px);overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);box-shadow:0 20px 60px rgba(0,0,0,.5);animation:popIn .2s ease}
.picker-header{padding:14px 16px 10px;border-bottom:1px solid var(--border)}.picker-title{font-size:16px;font-weight:700}.picker-sub{font-size:11px;color:var(--text3);margin-top:2px}.picker-body{padding:10px}
.provider-section{margin-bottom:6px}
.prov-sec-header{display:flex;align-items:center;gap:8px;padding:8px 8px 6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text3);border-top:1px solid var(--border);padding-top:10px}
.prov-badge{font-size:9px;padding:2px 7px;border-radius:20px;font-weight:600;margin-left:auto}.free-badge{background:rgba(78,205,196,.12);color:var(--green)}.paid-badge{background:rgba(251,146,60,.1);color:#fb923c}
.needs-key-badge{font-size:9px;color:var(--text3);padding:2px 7px;background:var(--surface2);border:1px solid var(--border);border-radius:20px}
.auto-option{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:var(--r2);cursor:pointer;background:linear-gradient(135deg,rgba(108,99,255,.08),rgba(78,205,196,.06));border:1px solid rgba(108,99,255,.2);margin-bottom:8px;transition:all .18s}
.auto-option:hover{border-color:rgba(108,99,255,.4)}.auto-option.selected{border-color:rgba(108,99,255,.5);background:linear-gradient(135deg,rgba(108,99,255,.14),rgba(78,205,196,.1))}
.model-option{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r);cursor:pointer;transition:background .13s;margin-bottom:2px;border:1px solid transparent}
.model-option:hover{background:var(--surface2)}.model-option.selected{background:var(--surface3);border-color:var(--border)}.model-option.disabled{opacity:.38;cursor:not-allowed}
.mo-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}.mo-info{flex:1;min-width:0}.mo-name{font-size:14px;font-weight:500;color:var(--text)}
.mo-meta{font-size:11px;color:var(--text3);margin-top:1px;display:flex;align-items:center;gap:6px}.mo-speed{padding:1px 6px;border-radius:20px;font-size:10px;background:var(--surface2);border:1px solid var(--border)}
.mo-check{font-size:14px;color:var(--accent);flex-shrink:0}.mo-lock{font-size:11px;color:var(--text3);flex-shrink:0}

/* Chat area */
.chat-wrap{flex:1;overflow:hidden;display:flex;flex-direction:column}
.chat{flex:1;overflow-y:auto;padding:20px;max-width:840px;width:100%;margin:0 auto}
.lb-view{flex:1;overflow-y:auto;padding:20px;max-width:940px;width:100%;margin:0 auto;display:none}
.welcome{text-align:center;padding:44px 20px}.welcome h2{font-size:26px;font-weight:700;letter-spacing:-.5px;margin-bottom:6px}
.welcome p{color:var(--text2);font-size:15px;max-width:460px;margin:0 auto 18px;line-height:1.6}
.exs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:620px;margin:0 auto}
.ex{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:9px 14px;color:var(--text2);font-size:13px;cursor:pointer;transition:.15s;font-family:inherit}
.ex:hover{border-color:var(--accent);color:var(--text)}
.msg{margin-bottom:18px;animation:fi .3s ease}
.mu{display:flex;justify-content:flex-end;flex-direction:column;align-items:flex-end}
.mu .bub{background:var(--accent);color:#fff;border-radius:14px 14px 4px 14px;padding:12px 16px;max-width:70%;font-size:15px;line-height:1.5}
.msg-actions{display:flex;gap:6px;margin-top:6px;opacity:1}
.msg-act-btn{background:transparent;border:1px solid var(--border);border-radius:8px;padding:5px 12px;font-size:12px;color:var(--text2);cursor:pointer;font-family:'JetBrains Mono',monospace;transition:.15s;display:flex;align-items:center;gap:5px}
.msg-act-btn:hover{border-color:var(--accent);color:var(--accent)}.msg-act-btn.retry-btn:hover{border-color:var(--green);color:var(--green)}
.msg-act-btn.copied{border-color:var(--green);color:var(--green)}
.file-attach{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.file-pill{font-size:10px;padding:3px 8px;border-radius:6px;background:rgba(108,99,255,.12);color:var(--accent);font-family:'JetBrains Mono',monospace;display:flex;align-items:center;gap:3px}
.mb{display:flex;flex-direction:column;gap:6px}
.sa{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;overflow:hidden}
.ph{font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--green);margin-bottom:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ph .sp{width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0}
.slots{display:flex;flex-direction:column;gap:3px}
.slot{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:7px;background:var(--surface2);border:1px solid transparent;transition:all .3s;opacity:.25}
.slot.scanning{opacity:1;border-color:var(--border)}.slot.winner{opacity:1;border-color:var(--green);background:rgba(78,205,196,.06);transform:scale(1.01)}.slot.rejected{opacity:.12;transform:scale(.97)}
.s-rank{font-size:9px;color:var(--text3);font-family:'JetBrains Mono',monospace;width:16px;text-align:center}
.s-name{font-size:11px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-bar{width:80px;height:4px;border-radius:2px;background:var(--surface3);overflow:hidden;flex-shrink:0}
.s-fill{height:100%;border-radius:2px;transition:width .4s ease}
.s-score{font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--text2);min-width:30px;text-align:right}
.s-chk{font-size:12px;opacity:0;transition:opacity .3s;flex-shrink:0;width:14px}.slot.winner .s-chk{opacity:1}
.bsrc{font-size:8px;color:var(--text3);font-family:'JetBrains Mono',monospace;margin-top:6px}.bsrc a{color:var(--accent);text-decoration:none}
.trans{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:11px 14px;font-size:13px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bdg{font-size:13px;font-weight:600;padding:4px 10px;border-radius:5px;font-family:'JetBrains Mono',monospace}
.bdg.intent{background:rgba(108,99,255,.15);color:#9d97ff}.bdg.model{padding:3px 9px;border-radius:5px;font-family:'JetBrains Mono',monospace;font-weight:600;font-size:12px}
.bdg.score{background:rgba(78,205,196,.1);color:var(--green)}.bdg.time{background:rgba(154,152,144,.1);color:var(--text2)}.bdg.std{background:rgba(108,99,255,.08);color:#8a84ff}
.tgl{font-size:11px;color:var(--accent);cursor:pointer;background:none;border:none;font-family:inherit}.tgl:hover{text-decoration:underline}
.rp{display:none;width:100%;margin-top:4px}.rp.show{display:flex;flex-direction:column;gap:8px}
.rp-section{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.rp-section-header{padding:10px 14px;font-size:13px;font-weight:600;font-family:'Roboto',sans-serif;color:var(--text);border-bottom:1px solid var(--border);background:var(--surface2);display:flex;align-items:center;gap:6px}
.rp-section-header .rp-icon{font-size:14px}
.rp-section-body{padding:14px;font-size:14px;color:var(--text2);font-family:'Roboto',sans-serif;line-height:1.7;white-space:pre-wrap;max-height:260px;overflow-y:auto}
.bbot{background:var(--surface2);border:1px solid var(--border);border-radius:4px 14px 14px 14px;padding:15px;max-width:88%;font-size:15px;line-height:1.7;word-wrap:break-word}
.bbot code{background:rgba(108,99,255,.12);padding:1px 4px;border-radius:3px;font-family:'JetBrains Mono',monospace;font-size:12px}
.bbot pre{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:0;overflow:hidden;margin:8px 0;position:relative}
.bbot pre .code-header{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:var(--surface3);border-bottom:1px solid var(--border);font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text3)}
.bbot pre .copy-btn{background:none;border:1px solid var(--border);border-radius:4px;padding:2px 8px;color:var(--text2);font-size:10px;font-family:'JetBrains Mono',monospace;cursor:pointer;transition:.15s}
.bbot pre .copy-btn:hover{border-color:var(--accent);color:var(--accent)}.bbot pre .copy-btn.copied{border-color:var(--green);color:var(--green)}
.bbot pre code{display:block;padding:12px;overflow-x:auto;font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.5;background:transparent}
.bbot h1,.bbot h2,.bbot h3{font-size:16px;font-weight:600;color:var(--text);margin:14px 0 7px;line-height:1.4}.bbot h1{font-size:18px}.bbot h2{font-size:16px}.bbot h3{font-size:15px}
.bbot p{margin:5px 0 10px;line-height:1.7}.bbot ul,.bbot ol{padding-left:22px;margin:5px 0 10px}.bbot li{margin:3px 0;line-height:1.7}.bbot strong,.bbot b{color:var(--text);font-weight:600}.bbot hr{border:none;border-top:1px solid var(--border);margin:10px 0}
.err{padding:11px 15px;background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.3);border-radius:8px;font-size:13px;color:var(--red);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.err-retry{background:transparent;border:1px solid rgba(255,107,107,.3);border-radius:6px;padding:3px 10px;font-size:10px;color:var(--red);cursor:pointer;font-family:'JetBrains Mono',monospace;margin-left:auto;transition:.15s;display:flex;align-items:center;gap:4px}.err-retry:hover{background:rgba(255,107,107,.15);border-color:var(--red)}
.edit-wrap{display:flex;gap:8px;align-items:flex-end;width:100%;max-width:100%}
.edit-ta{flex:1;resize:vertical;background:var(--surface2);border:1px solid var(--accent);border-radius:10px;padding:14px 18px;color:var(--text);font-size:15px;font-family:'Roboto',sans-serif;line-height:1.6;min-height:90px;max-height:300px;outline:none}
.edit-actions{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.edit-ok{width:36px;height:36px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-size:16px;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center}.edit-ok:hover{background:#5a52e0}
.edit-cancel{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text3);font-size:14px;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center}.edit-cancel:hover{color:var(--red);border-color:rgba(255,107,107,.3)}
.inp{border-top:1px solid var(--border);padding:10px 18px;background:var(--surface);flex-shrink:0}
.inp-r{max-width:840px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.inp-wrap{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:border-color .18s}.inp-wrap:focus-within{border-color:var(--accent)}
.inp-ta{width:100%;padding:12px 16px 4px;background:transparent;border:none;color:var(--text);font-size:15px;font-family:'Roboto',sans-serif;resize:none;outline:none;line-height:1.5;min-height:42px;max-height:140px}.inp-ta::placeholder{color:var(--text3)}

.file-label{display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text3);font-size:10px;cursor:pointer;font-family:'JetBrains Mono',monospace;transition:.15s}.file-label:hover{border-color:var(--accent);color:var(--accent)}.file-label input{display:none}

.lbh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}.lbh h2{font-size:20px;font-weight:700}
.lbsrc{font-size:9px;color:var(--text3);font-family:'JetBrains Mono',monospace}
.lbr{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:4px 10px;color:var(--text2);font-size:10px;cursor:pointer;font-family:inherit;transition:.15s}.lbr:hover{border-color:var(--accent);color:var(--text)}
.lbs{margin-bottom:18px}.lbs h3{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;text-transform:capitalize}
.lt{width:100%;border-collapse:collapse;font-size:10px}.lt th{text-align:left;color:var(--text3);font-weight:500;padding:5px 6px;border-bottom:1px solid var(--border);font-family:'JetBrains Mono',monospace;font-size:9px}
.lt td{padding:5px 6px;border-bottom:1px solid rgba(42,42,42,.4);color:var(--text2)}.lt tr:first-child td{font-weight:600}
.lbar{width:100%;height:6px;border-radius:3px;background:var(--surface3);overflow:hidden}.lbf{height:100%;border-radius:3px}
.vpill{font-size:8px;padding:1px 5px;border-radius:3px;font-family:'JetBrains Mono',monospace;font-weight:600}

/* ═══ TUTORIAL OVERLAY ═══ */
.tut-overlay{position:fixed;inset:0;z-index:9999;pointer-events:none;opacity:0;transition:opacity .3s ease;}
.tut-overlay.active{opacity:1;pointer-events:auto;}
.tut-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1;}
.tut-highlight{position:absolute;z-index:2;border:2px solid var(--accent);border-radius:var(--r2);box-shadow:0 0 0 4000px rgba(0,0,0,.65),0 0 30px rgba(108,99,255,.4);transition:all .4s cubic-bezier(.4,0,.2,1);pointer-events:none;}
.tut-card{position:absolute;z-index:3;background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:20px 24px;max-width:340px;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:popIn .25s ease;pointer-events:auto;}
.tut-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:var(--r2) var(--r2) 0 0;}
.tut-step-badge{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;}
.tut-title{font-size:17px;font-weight:700;color:var(--text);margin-bottom:6px;}
.tut-desc{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:16px;}
.tut-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.tut-dots{display:flex;gap:6px;}
.tut-dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:background .2s;}
.tut-dot.active{background:var(--accent);}
.tut-btns{display:flex;gap:8px;}
.tut-btn{font-family:inherit;font-size:12px;font-weight:600;padding:8px 16px;border-radius:var(--r);cursor:pointer;transition:.15s;letter-spacing:0.5px;}
.tut-btn.skip{background:transparent;border:1px solid var(--border);color:var(--text3);}
.tut-btn.skip:hover{border-color:var(--text2);color:var(--text2);}
.tut-btn.next{background:var(--accent);border:1px solid var(--accent);color:#fff;}
.tut-btn.next:hover{background:#5a52e0;box-shadow:0 0 14px rgba(108,99,255,.3);}
/* ═══ TERMS & CONDITIONS MODAL ═══ */
.tos-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:250;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s ease}
.tos-card{width:480px;max-width:94vw;max-height:90vh;background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);box-shadow:0 24px 80px rgba(0,0,0,.7);animation:popIn .22s ease;overflow:hidden;display:flex;flex-direction:column}
.tos-header{padding:24px 28px 12px;text-align:center;flex-shrink:0}
.tos-header h2{font-size:18px;font-weight:700;color:var(--text);margin-bottom:4px}
.tos-header p{font-size:11px;color:var(--text3)}

.tos-bullet{display:flex;gap:8px;margin-bottom:8px;font-size:12px;color:var(--text2);line-height:1.6}
.tos-bullet::before{content:'•';color:var(--accent);font-weight:700;flex-shrink:0;margin-top:1px}
.tos-read-more{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--accent);cursor:pointer;background:none;border:1px solid rgba(108,99,255,.25);border-radius:6px;padding:5px 12px;font-family:inherit;transition:.15s;margin:8px 0 18px}
.tos-read-more:hover{background:rgba(108,99,255,.08);border-color:var(--accent)}
.tos-read-more svg{flex-shrink:0}
.tos-checkbox-row{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);margin-bottom:16px;cursor:pointer;transition:border-color .15s}
.tos-checkbox-row:hover{border-color:var(--accent)}
.tos-checkbox-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex-shrink:0;cursor:pointer;margin-top:1px}
.tos-checkbox-row label{font-size:12px;color:var(--text2);line-height:1.5;cursor:pointer;user-select:none}
.tos-agree-btn{width:100%;padding:13px;border-radius:var(--r);border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;letter-spacing:.3px}
.tos-agree-btn:hover:not(:disabled){background:#5a52e0}
.tos-agree-btn:disabled{opacity:.35;cursor:not-allowed}
.tos-decline{text-align:center;margin-top:10px;padding-bottom:4px}
.tos-decline a{font-size:11px;color:var(--text3);cursor:pointer;text-decoration:none;transition:color .13s}
.tos-decline a:hover{color:var(--red)}

/* Full terms popup */

.tos-full-body{padding:20px 24px;overflow-y:auto;flex:1;font-size:13px;color:var(--text2);line-height:1.8}

<script>

const SUPABASE_URL = 'https://sqdioeitfrownfhyfrxo.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxZGlvZWl0ZnJvd25maHlmcnhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxNDM2NjIsImV4cCI6MjA4OTcxOTY2Mn0.pRcU6dXLyXsQanzvSx29esOxnARbo5GP9GhlbnP873I';
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const API='http://localhost:8000';
const cv=document.getElementById('cv'),pi=document.getElementById('pi'),sb=document.getElementById('sb');
let busy=false;
let currentUser=null;   // auth.users object (id, email, etc.)
let userProfile=null;   // profiles table row (display_name, avatar_url, bio)

// ═══════════════════════════════════════════════════════════
// AUTH — Signup / Signin / Session
// ═══════════════════════════════════════════════════════════
function showAuthModal(startTab){
  var tab=startTab||'signin';
  document.getElementById('auth-modal').innerHTML=
    '<div class="auth-overlay" onclick="if(event.target===this)closeAuthModal()">'+
      '<div class="auth-card" style="position:relative" onclick="event.stopPropagation()">'+
        '<button class="auth-close" onclick="closeAuthModal()">✕</button>'+
        '<div class="auth-header"><div class="auth-logo"><span>TAP</span></div><div class="auth-sub">Sign in to save your chats and get full access</div></div>'+
        '<div class="auth-tabs">'+
          '<div class="auth-tab'+(tab==='signin'?' on':'')+'" onclick="switchAuthTab(\'signin\')">Sign In</div>'+
          '<div class="auth-tab'+(tab==='signup'?' on':'')+'" onclick="switchAuthTab(\'signup\')">Sign Up</div>'+
        '</div>'+
        '<div class="auth-body" id="auth-body"></div>'+
        '<div class="auth-skip">or <a onclick="closeAuthModal()">skip for now</a> (limited access)</div>'+
      '</div>'+
    '</div>';
  renderAuthForm(tab);
}
function closeAuthModal(){document.getElementById('auth-modal').innerHTML='';}
function switchAuthTab(tab){
  document.querySelectorAll('.auth-tab').forEach(function(t){t.classList.toggle('on',t.textContent.toLowerCase().replace(' ','')==tab);});
  renderAuthForm(tab);
}
function renderAuthForm(tab){
  var body=document.getElementById('auth-body');
  if(!body)return;
  if(tab==='signup'){
    body.innerHTML=
      '<div class="auth-field"><label class="auth-label">Display Name</label><input class="auth-input" id="auth-name" placeholder="Your name" autocomplete="name"/></div>'+
      '<div class="auth-field"><label class="auth-label">Email</label><input class="auth-input" id="auth-email" type="email" placeholder="you@example.com" autocomplete="email"/></div>'+
      '<div class="auth-field"><label class="auth-label">Password</label><input class="auth-input" id="auth-pass" type="password" placeholder="Min 6 characters" autocomplete="new-password"/></div>'+
      '<button class="auth-submit" id="auth-go" onclick="doSignup()">Create Account</button>'+
      '<div class="auth-err" id="auth-err"></div>';
  }else{
    body.innerHTML=
      '<div class="auth-field"><label class="auth-label">Email</label><input class="auth-input" id="auth-email" type="email" placeholder="you@example.com" autocomplete="email"/></div>'+
      '<div class="auth-field"><label class="auth-label">Password</label><input class="auth-input" id="auth-pass" type="password" placeholder="Password" autocomplete="current-password"/></div>'+
      '<button class="auth-submit" id="auth-go" onclick="doSignin()">Sign In</button>'+
      '<div class="auth-err" id="auth-err"></div>';
  }
  // Enter key submits
  setTimeout(function(){
    var el=document.getElementById('auth-pass');
    if(el)el.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();document.getElementById('auth-go').click();}});
  },50);
}
async function doSignup(){
  var name=(document.getElementById('auth-name').value||'').trim();
  var email=(document.getElementById('auth-email').value||'').trim();
  var pass=document.getElementById('auth-pass').value;
  var errEl=document.getElementById('auth-err');
  if(!email||!pass){errEl.textContent='Email and password required';return;}
  if(pass.length<6){errEl.textContent='Password must be at least 6 characters';return;}
  errEl.textContent='';document.getElementById('auth-go').disabled=true;
  var res=await supa.auth.signUp({email:email,password:pass,options:{data:{display_name:name||email.split('@')[0]}}});
  document.getElementById('auth-go').disabled=false;
  if(res.error){errEl.textContent=res.error.message;return;}
  if(res.data.user&&!res.data.session){errEl.innerHTML='<span style="color:var(--green)">Check your email to confirm your account!</span>';return;}
  closeAuthModal();
  // Gate behind T&C acceptance
  showTosGate(res.data.session);
}
async function doSignin(){
  var email=(document.getElementById('auth-email').value||'').trim();
  var pass=document.getElementById('auth-pass').value;
  var errEl=document.getElementById('auth-err');
  if(!email||!pass){errEl.textContent='Email and password required';return;}
  errEl.textContent='';document.getElementById('auth-go').disabled=true;
  var res=await supa.auth.signInWithPassword({email:email,password:pass});
  document.getElementById('auth-go').disabled=false;
  if(res.error){errEl.textContent=res.error.message;return;}
  closeAuthModal();
  // Gate behind T&C acceptance
  showTosGate(res.data.session);
}
async function doSignout(){
  await supa.auth.signOut();
  currentUser=null;userProfile=null;
  userKeys={gemini:'',claude:'',groq:'',openrouter:''};
  keyStatus={gemini:false,claude:false,groq:false,openrouter:false};
  chats=[{id:uid(),title:'New conversation',date:todayStr(),html:''}];
  activeChatId=chats[0].id;
  cv.innerHTML=renderWelcome();renderChatList();renderUserArea();renderLoginGate();renderKeysPanel();
}

}
function markTosAccepted(userId){

}

function toggleTosAgree(){
  var cb=document.getElementById('tos-check');
  var btn=document.getElementById('tos-agree-btn');
  if(cb&&btn){btn.disabled=!cb.checked;}
}

async function acceptTos(){
  var session=window._pendingTosSession;
  if(!session||!session.user)return;
  markTosAccepted(session.user.id);
  document.getElementById('tos-modal').innerHTML='';
  window._pendingTosSession=null;
  await onAuthChange(session);
}

async function declineTos(){
  document.getElementById('tos-modal').innerHTML='';
  window._pendingTosSession=null;
  await supa.auth.signOut();
  currentUser=null;userProfile=null;
  renderUserArea();renderLoginGate();
}

// PROFILE — reads/writes from public.profiles table
// ═══════════════════════════════════════════════════════════
async function loadProfile(){
  if(!currentUser)return;
  var res=await supa.from('profiles').select('*').eq('id',currentUser.id).single();
  if(res.error){
    console.error('Load profile error:',res.error);
    // Fallback: profile might not exist yet (race condition), create it
    if(res.error.code==='PGRST116'){
      var name=currentUser.user_metadata?.display_name||currentUser.email.split('@')[0];
      await supa.from('profiles').insert({id:currentUser.id,email:currentUser.email,display_name:name});
      var retry=await supa.from('profiles').select('*').eq('id',currentUser.id).single();
      if(!retry.error) userProfile=retry.data;
    }
    return;
  }
  userProfile=res.data;
}

function showProfileModal(){
  closeUserDropdown();
  if(!currentUser||!userProfile)return;
  document.getElementById('profile-modal').innerHTML=
    '<div class="auth-overlay" onclick="if(event.target===this)closeProfileModal()">'+
      '<div class="profile-card" onclick="event.stopPropagation()">'+
        '<div class="profile-header">Edit Profile</div>'+
        '<div class="profile-body">'+
          '<div class="auth-field"><label class="auth-label">Display Name</label><input class="auth-input" id="prof-name" value="'+esc(userProfile.display_name||'')+'"/></div>'+
          '<div class="auth-field"><label class="auth-label">Email</label><input class="auth-input" value="'+esc(userProfile.email||currentUser.email)+'" disabled style="opacity:.5"/></div>'+
          '<div class="auth-field"><label class="auth-label">Bio</label><textarea class="auth-input" id="prof-bio" rows="3" placeholder="Tell us about yourself..." style="resize:vertical;min-height:60px">'+esc(userProfile.bio||'')+'</textarea></div>'+
          '<div class="auth-field"><label class="auth-label">Avatar URL</label><input class="auth-input" id="prof-avatar" value="'+esc(userProfile.avatar_url||'')+'" placeholder="https://..."/></div>'+
          '<button class="profile-save" onclick="saveProfile()">Save Changes</button>'+
          '<div class="auth-err" id="prof-err" style="margin-top:8px"></div>'+
        '</div>'+
      '</div>'+
    '</div>';
}
function closeProfileModal(){document.getElementById('profile-modal').innerHTML='';}
async function saveProfile(){
  var name=(document.getElementById('prof-name').value||'').trim();
  var bio=(document.getElementById('prof-bio').value||'').trim();
  var avatar=(document.getElementById('prof-avatar').value||'').trim();
  var errEl=document.getElementById('prof-err');
  if(!name){errEl.textContent='Name cannot be empty';return;}
  var res=await supa.from('profiles').update({
    display_name:name, bio:bio, avatar_url:avatar
  }).eq('id',currentUser.id);
  if(res.error){errEl.textContent=res.error.message;return;}
  // Also update auth metadata so it stays in sync
  await supa.auth.updateUser({data:{display_name:name}});
  userProfile.display_name=name;userProfile.bio=bio;userProfile.avatar_url=avatar;
  errEl.innerHTML='<span style="color:var(--green)">Saved!</span>';
  renderUserArea();
  setTimeout(closeProfileModal,800);
}

function renderUserArea(){
  var el=document.getElementById('user-area');
  if(currentUser&&userProfile){
    var name=userProfile.display_name||currentUser.email.split('@')[0];
    var initials=name.slice(0,2).toUpperCase();
    var avHtml;
    if(userProfile.avatar_url){
      avHtml='<img src="'+esc(userProfile.avatar_url)+'" style="width:24px;height:24px;border-radius:50%;object-fit:cover" onerror="this.style.display=\'none\';this.nextSibling.style.display=\'flex\'"/><div class="user-av" style="display:none">'+esc(initials)+'</div>';
    }else{
      avHtml='<div class="user-av">'+esc(initials)+'</div>';
    }
    el.innerHTML='<button class="user-btn" onclick="toggleUserDropdown()">'+avHtml+'<span>'+esc(name)+'</span></button>';
  }else{
    el.innerHTML='<button class="user-btn" onclick="showAuthModal(\'signin\')"><span style="font-size:13px">👤</span> Login</button>';
  }
}
function toggleUserDropdown(){
  var dd=document.getElementById('user-dropdown');
  if(dd.style.display==='block'){closeUserDropdown();return;}
  if(!currentUser||!userProfile)return;
  var name=userProfile.display_name||currentUser.email.split('@')[0];
  dd.innerHTML=
    '<div class="user-dropdown">'+
      '<div class="ud-header"><div class="ud-name">'+esc(name)+'</div><div class="ud-email">'+esc(currentUser.email)+'</div>'+(userProfile.bio?'<div style="font-size:10px;color:var(--text3);margin-top:3px">'+esc(userProfile.bio)+'</div>':'')+'</div>'+
      '<div class="ud-item" onclick="showProfileModal()">✎ Edit Profile</div>'+
      '<div class="ud-item danger" onclick="doSignout()">↪ Sign Out</div>'+
    '</div>';
  dd.style.display='block';
  setTimeout(function(){document.addEventListener('click',closeUserDropdown,{once:true});},10);
}
function closeUserDropdown(){document.getElementById('user-dropdown').style.display='none';}

function renderLoginGate(){
  var el=document.getElementById('login-gate-bar');
  if(currentUser){el.innerHTML='';return;}
  el.innerHTML='<div class="login-gate">🔒 <a onclick="showAuthModal(\'signin\')">Sign in</a> or <a onclick="showAuthModal(\'signup\')">create an account</a> to send messages and save chats</div>';
}

// SUPABASE CHAT PERSISTENCE

async function loadChatsFromDB(){
  if(!currentUser)return;
  var res=await supa.from('chats').select('*').eq('user_id',currentUser.id).order('updated_at',{ascending:false});
  if(res.error){console.error('Load chats error:',res.error);return;}
  if(res.data&&res.data.length){
    chats=res.data.map(function(r){return{id:r.id,title:r.title,date:r.chat_date||'',html:r.html||''};});
    // Always open a new chat on login instead of resuming existing
    var newId=uid();
    chats.unshift({id:newId,title:'New conversation',date:todayStr(),html:''});
    activeChatId=newId;
    cv.innerHTML=renderWelcome();
    saveChatToDB(chats[0]);
  }else{
    var newId=uid();
    chats=[{id:newId,title:'New conversation',date:todayStr(),html:''}];
    activeChatId=newId;
    cv.innerHTML=renderWelcome();
    await saveChatToDB(chats[0]);
  }
  renderChatList();
}
async function saveChatToDB(c){
  if(!currentUser||!c)return;
  var res=await supa.from('chats').upsert(
    {id:c.id,user_id:currentUser.id,title:c.title,chat_date:c.date,html:c.html,updated_at:new Date().toISOString()},
    {onConflict:'id'}
  );
  if(res.error){
    console.error('Save chat error:',res.error.message,res.error);
  }
}
async function deleteChatFromDB(id){
  if(!currentUser)return;
  await supa.from('chats').delete().eq('id',id).eq('user_id',currentUser.id);
}

function saveAllChats(){var c=getActiveChat();if(c)saveChatToDB(c);}

// ═══════════════════════════════════════════════════════════
// AUTH STATE LISTENER
// ═══════════════════════════════════════════════════════════
async function onAuthChange(session){
  if(session&&session.user){
    currentUser=session.user;
    await loadProfile();
    await loadUserKeys();
    renderUserArea();renderLoginGate();
    await loadChatsFromDB();
  }else{
    currentUser=null;userProfile=null;
    userKeys={gemini:'',claude:'',groq:'',openrouter:''};
    keyStatus={gemini:false,claude:false,groq:false,openrouter:false};
    renderKeysPanel();
    chats=[{id:uid(),title:'New conversation',date:todayStr(),html:''}];
    activeChatId=chats[0].id;
    cv.innerHTML=renderWelcome();renderChatList();renderUserArea();renderLoginGate();
  }
}

supa.auth.onAuthStateChange(function(event,session){
  // INITIAL_SESSION is handled by the getSession() call below — skip to avoid double load
  if(event==='INITIAL_SESSION')return;
  // Gate behind T&C for sign-in events; sign-out events go through directly
  if(session&&session.user){showTosGate(session);}
  else{onAuthChange(session);}
});

// Check existing session on load
(async function(){
  var res=await supa.auth.getSession();
  if(res.data.session){
    // Gate behind T&C acceptance
    showTosGate(res.data.session);
  }else{
    renderUserArea();renderLoginGate();
  }
})();

function uid(){
  if(typeof crypto!=='undefined'&&crypto.randomUUID)return crypto.randomUUID();
  // fallback for older browsers
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){
    var r=Math.random()*16|0,v=c==='x'?r:(r&0x3|0x8);return v.toString(16);
  });
}

function renderChatList(){

    var cls='chat-item'+(c.id===activeChatId?' active':'');
    var n=((c.html||'').match(/class="msg /g)||[]).length;
    return '<div class="'+cls+'" onclick="switchChat(\''+c.id+'\')"><div class="chat-dot"></div><div class="chat-info"><div class="chat-title">'+esc(c.title)+'</div><div class="chat-meta">'+c.date+(n?' · '+n+' msg'+(n!==1?'s':''):'')+'</div></div><button class="chat-del" onclick="event.stopPropagation();delChat(\''+c.id+'\')" title="Delete">✕</button></div>';

function newChat(){
  saveCurrentChatHtml();var id=uid();
  chats.unshift({id:id,title:"New conversation",date:todayStr(),html:""});
  activeChatId=id;cv.innerHTML=renderWelcome();
  if(currentUser)saveChatToDB(chats[0]);
  renderChatList();pi.focus();
}
function switchChat(id){
  if(id===activeChatId)return;
  saveCurrentChatHtml();
  activeChatId=id;
  var c=getActiveChat();
  cv.innerHTML=(c&&c.html&&c.html.trim())?c.html:renderWelcome();
  renderChatList();
}
function delChat(id){
  chats=chats.filter(function(c){return c.id!==id;});
  if(!chats.length){var nid=uid();chats=[{id:nid,title:"New conversation",date:todayStr(),html:""}];if(currentUser)saveChatToDB(chats[0]);}
  if(activeChatId===id){activeChatId=chats[0].id;cv.innerHTML=getActiveChat().html||renderWelcome();}
  deleteChatFromDB(id);renderChatList();
}
function saveCurrentChatHtml(){
  var c=getActiveChat();
  if(!c)return;
  // Clone the chat DOM, remove the welcome screen before saving
  var clone=cv.cloneNode(true);
  var wel=clone.querySelector('#wel');
  if(wel)wel.remove();
  c.html=clone.innerHTML;
  if(currentUser)saveChatToDB(c);
}

function cleanPrompt(raw){var t=raw;t=t.replace(/<(\w+)>/g,function(_,tag){var L={task:'Task',requirements:'Requirements',format:'Output format',instructions:'Instructions',context:'Context'};return '\n'+(L[tag.toLowerCase()]||tag)+': ';});t=t.replace(/<\/\w+>/g,'');t=t.replace(/^#+\s*/gm,'');t=t.replace(/\n{3,}/g,'\n\n');return t.trim();}
function splitPromptSections(raw){
  var cleaned=cleanPrompt(raw);
  var contextPatterns=[
    /^(?:Important context|Context|Context and inferred constraints|Metadata):?\s*$/im,
    /^(?:Please follow these guidelines|Guidelines|Follow these steps|Instructions|Working rules):?\s*$/im,
    /^(?:Also follow these guardrails|Guardrails|Style guardrails):?\s*$/im,
    /^(?:Before finalizing,? check|Final checks|Grounding and verification|Verification|Verification before final answer|Verification loop):?\s*$/im,
    /^(?:Return the answer in this format|Output format|Output contract|Definition of done):?\s*$/im,
    /^(?:Additional notes):?\s*$/im,
    /^(?:If you need to make an assumption)/im,
    /^(?:Only generate what is necessary)/im,
    /^(?:Respond now|Answer now|Deliver the best final answer now)\.?\s*$/im
  ];
  var lines=cleaned.split('\n');var coreLines=[];var ctxLines=[];var inCtx=false;
  for(var i=0;i<lines.length;i++){
    var line=lines[i];var isCtxHeader=false;
    for(var j=0;j<contextPatterns.length;j++){if(contextPatterns[j].test(line.trim())){isCtxHeader=true;break;}}
    if(isCtxHeader){inCtx=true;ctxLines.push(line);continue;}
    if(inCtx){
      var isNewMainSection=/^(?:User request|Help with|Goal:|Original user request|Request:)/i.test(line.trim());
      if(isNewMainSection){inCtx=false;coreLines.push(line);}
      else{ctxLines.push(line);}
    }else{coreLines.push(line);}
  }
  return{core:coreLines.join('\n').trim(),context:ctxLines.join('\n').trim()};
}

async function sendPrompt(prompt){
  if(!prompt||busy)return;
  // Gate: must be logged in
  if(!currentUser){showAuthModal('signin');return;}
  busy=true;sb.disabled=true;
  var id='m'+Date.now();promptStore['resp-'+id]=prompt;
  addHtml('<div class="msg mb" id="'+id+'"></div>');var el=document.getElementById(id);
  try{
    el.innerHTML='<div class="sa" id="sa-'+id+'"><div class="ph"><div class="sp"></div> Analyzing prompt...</div><div class="slots" id="sl-'+id+'"></div></div>';cv.scrollTop=cv.scrollHeight;
    var mo=null;if(currentModelKey&&ALL_MODELS[currentModelKey])mo=ALL_MODELS[currentModelKey].id;
    var aR=await fetch(API+'/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:prompt,api_keys:userKeys,override_provider:mo?null:(currentOverride||null),override_model_id:mo})});
    if(!aR.ok)throw new Error((await aR.json()).detail||'Analyze failed');var a=await aR.json();
    await animSel(id,a);
    var sa=document.getElementById('sa-'+id),ph=sa.querySelector('.ph');ph.innerHTML='<div class="sp"></div> <span style="color:'+vcolor(a.selected_vendor)+'">'+a.selected_display_name+'</span> is generating...';cv.scrollTop=cv.scrollHeight;
    var gR=await fetch(API+'/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reprompted_prompt:a.reprompted_prompt,provider:a.selected_provider,model_id:a.selected_model_id,original_prompt:prompt,intent:a.intent,api_keys:userKeys})});
    if(!gR.ok)throw new Error((await gR.json()).detail||'Generate failed');var g=await gR.json();

    // Failover animation: if model changed, show the transition
    if(g.failover_from){
      var foColor=vcolor(g.failover_from);
      ph.innerHTML='<span style="color:'+foColor+'">'+a.selected_display_name+'</span> <span style="color:var(--red)">failed</span> — finding next best model...';
      cv.scrollTop=cv.scrollHeight;await sleep(600);
      ph.innerHTML='<div class="sp"></div> Falling over to <span style="color:'+vcolor(g.vendor)+'">'+g.model_display_name+'</span>...';
      cv.scrollTop=cv.scrollHeight;await sleep(500);
      ph.innerHTML='<div class="sp"></div> <span style="color:'+vcolor(g.vendor)+'">'+g.model_display_name+'</span> re-optimizing prompt...';
      cv.scrollTop=cv.scrollHeight;await sleep(400);
      ph.innerHTML='<div class="sp"></div> <span style="color:'+vcolor(g.vendor)+'">'+g.model_display_name+'</span> is generating...';
      cv.scrollTop=cv.scrollHeight;await sleep(300);
    }

    var gR=await fetch(API+'/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reprompted_prompt:a.reprompted_prompt,provider:a.selected_provider,model_id:a.selected_model_id,original_prompt:prompt,intent:a.intent,api_keys:userKeys})});
    if(!gR.ok)throw new Error((await gR.json()).detail||'Generate failed');var g=await gR.json();var rpId='rp'+Date.now(),mc=vcolor(g.vendor||a.selected_vendor);
    lastPrompts.push({prompt:prompt,msgId:id});
    // Use the failover-reprompted prompt if available, otherwise the original
    var finalPrompt=g.reprompted_prompt||a.reprompted_prompt;
    var rpSplit=splitPromptSections(finalPrompt);var rpId='rp'+Date.now(),mc=vcolor(g.vendor||a.selected_vendor);
    el.innerHTML='<div class="trans"><span class="bdg intent">'+a.intent.replace(/_/g,' ')+'</span><span style="color:var(--text3);font-size:12px">→ '+a.benchmark_name+' →</span><span class="bdg model" style="background:'+mc+'20;color:'+mc+'">'+g.model_display_name+'</span><span class="bdg score">#'+a.rank+'/'+a.total_candidates+' · '+a.intent_score+'</span><span class="bdg time">'+g.latency_ms+'ms</span><span class="bdg std">'+a.prompt_standard+'</span>'+(g.failover_from?'<span class="bdg" style="background:rgba(255,107,107,.1);color:var(--red)">failover from '+g.failover_from+'</span>':'')+'<button class="tgl" onclick="document.getElementById(\''+rpId+'\').classList.toggle(\'show\')">▸ optimized prompt</button><div class="rp" id="'+rpId+'">'+(rpSplit.core?'<div class="rp-section"><div class="rp-section-header"><span class="rp-icon">✨</span> Optimized Prompt</div><div class="rp-section-body">'+esc(rpSplit.core)+'</div></div>':'')+(rpSplit.context?'<div class="rp-section"><div class="rp-section-header"><span class="rp-icon">📋</span> Context &amp; Guidelines</div><div class="rp-section-body">'+esc(rpSplit.context)+'</div></div>':'')+'</div></div><div class="bbot">'+fmt(esc(g.response))+'</div><div class="msg-actions" style="opacity:1;margin-top:6px"><button class="msg-act-btn retry-btn" onclick="retryFromMsg(\''+id+'\')">↻ Retry</button></div>';
    cv.scrollTop=cv.scrollHeight;
    var c=getActiveChat();if(c&&c.title==='New conversation'){c.title=prompt.slice(0,42)+(prompt.length>42?'…':'');renderChatList();}
    saveCurrentChatHtml();
  }catch(e){el.innerHTML='<div class="err"><span>⚠ '+esc(e.message||'Backend error')+'</span><button class="err-retry" onclick="retryFromError(\''+id+'\')">↻ Retry</button></div>';saveCurrentChatHtml();}
  finally{busy=false;sb.disabled=false;pi.focus();}
}
async function send(){
  var prompt=pi.value.trim();if(!prompt&&!pendingFiles.length||busy)return;
  if(!currentUser){showAuthModal('signin');return;}
  var fileInfo='';
  if(pendingFiles.length){try{var reads=await Promise.all(pendingFiles.map(readFileAsText));reads.forEach(function(f){if(f.text.startsWith('data:'))fileInfo+='\n\n[Attached image: '+f.name+']';else fileInfo+='\n\n--- File: '+f.name+' ---\n'+f.text.slice(0,8000)+(f.text.length>8000?'\n[...truncated]':'');});}catch(e){fileInfo+='\n\n[Error: '+e.message+']';}}
  var fullPrompt=prompt+(fileInfo?'\n'+fileInfo:'');pi.value='';ar(pi);
  var uId='u'+Date.now();promptStore[uId]=prompt;
  var filesHtml='';if(pendingFiles.length){filesHtml='<div class="file-attach">'+pendingFiles.map(function(f){return '<span class="file-pill">📄 '+esc(f.name)+'</span>';}).join('')+'</div>';}
  pendingFiles=[];renderFileNames();
  var w=document.getElementById('wel');if(w)w.style.display='none';
  addHtml('<div class="msg mu" id="'+uId+'"><div class="bub">'+esc(prompt)+'</div>'+filesHtml+'<div class="msg-actions"><button class="msg-act-btn" onclick="startEdit(\''+uId+'\')">✎ Edit</button><button class="msg-act-btn" onclick="copyPrompt(\''+uId+'\',this)">⧉ Copy</button></div></div>');
  await sendPrompt(fullPrompt);
}

async function animSel(id,a){var sl=document.getElementById('sl-'+id),sa=document.getElementById('sa-'+id),ph=sa.querySelector('.ph');var rk=a.all_rankings,win=a.selected_model_id;if(!rk||rk.length===0){ph.innerHTML='<div class="sp"></div> Intent: <span style="color:var(--accent);font-weight:600">'+a.intent.replace(/_/g,' ')+'</span>';await sleep(400);var wc=vcolor(a.selected_vendor);ph.innerHTML='✓ <span style="color:'+wc+';font-weight:600">'+a.selected_display_name+'</span> — '+a.selection_reason;var src=document.createElement('div');src.className='bsrc';src.innerHTML='Prompt: <span style="color:var(--accent)">'+a.prompt_standard+'</span>';sl.after(src);await sleep(200);cv.scrollTop=cv.scrollHeight;return;}ph.innerHTML='<div class="sp"></div> Intent: <span style="color:var(--accent);font-weight:600">'+a.intent.replace(/_/g,' ')+'</span> — scanning '+a.benchmark_name+'...';await sleep(400);ph.innerHTML='<div class="sp"></div> Ranking '+rk.length+' models on <span style="color:var(--green)">'+a.score_category+'</span>';var sh='';for(var i=0;i<rk.length;i++){var r=rk[i],c=vcolor(r.vendor);sh+='<div class="slot" id="s-'+id+'-'+i+'"><span class="s-rank">#'+r.rank+'</span><span class="s-name" style="color:'+c+'">'+r.display_name+'</span><div class="s-bar"><div class="s-fill" style="width:0%;background:'+c+'"></div></div><span class="s-score" style="opacity:0">'+r.intent_score+'</span><span class="s-chk">✓</span></div>';}sl.innerHTML=sh;for(var i=0;i<rk.length;i++){var s=document.getElementById('s-'+id+'-'+i);s.classList.add('scanning');await sleep(80);s.querySelector('.s-fill').style.width=rk[i].intent_score+'%';s.querySelector('.s-score').style.opacity='1';await sleep(180);cv.scrollTop=cv.scrollHeight;}await sleep(250);ph.innerHTML='<div class="sp"></div> Selecting best model...';await sleep(300);for(var i=0;i<rk.length;i++){var s=document.getElementById('s-'+id+'-'+i);s.classList.remove('scanning');s.classList.add(rk[i].model_id===win?'winner':'rejected');}var wc=vcolor(a.selected_vendor);ph.innerHTML='✓ <span style="color:'+wc+';font-weight:600">'+a.selected_display_name+'</span> — '+a.selection_reason;var src=document.createElement('div');src.className='bsrc';src.innerHTML='Source: <a href="'+a.source_url+'" target="_blank">'+a.data_source+'</a> · Prompt: <span style="color:var(--accent)">'+a.prompt_standard+'</span>';sl.after(src);await sleep(350);cv.scrollTop=cv.scrollHeight;}

async function loadLB(){var lv=document.getElementById('lv');try{var lb=await(await fetch(API+'/api/leaderboard')).json();var cats={code_generation:'Coding',code_review:'Code Review',explanation:'Explanation',creative_writing:'Creative Writing',research:'Research',math_reasoning:'Math',summarization:'Speed / Summary',conversation:'Conversation'};var h='<div class="lbh"><div><h2>Model Leaderboard</h2><div class="lbsrc">Source: <a href="'+lb.source_url+'" target="_blank" style="color:var(--accent)">'+lb.source+'</a></div></div><button class="lbr" onclick="loadLB()">↻ Refresh</button></div>';h+='<div class="lbs"><h3>Overall ELO</h3><table class="lt"><tr><th>#</th><th>Model</th><th>Vendor</th><th>ELO</th><th style="width:160px"></th></tr>';lb.overall.forEach(function(m,i){var c=vcolor(m.vendor),p=((m.overall_elo-1000)/400*100).toFixed(0);h+='<tr><td style="color:var(--text3);font-weight:700">'+(i+1)+'</td><td style="color:'+c+'">'+m.display_name+'</td><td><span class="vpill" style="background:'+c+'18;color:'+c+'">'+m.vendor+'</span></td><td>'+m.overall_elo+'</td><td><div class="lbar"><div class="lbf" style="width:'+p+'%;background:'+c+'"></div></div></td></tr>';});h+='</table></div>';for(var cat in lb.by_category){var models=lb.by_category[cat];h+='<div class="lbs"><h3>'+(cats[cat]||cat)+'</h3><table class="lt"><tr><th>#</th><th>Model</th><th>Vendor</th><th>Score</th><th style="width:160px"></th></tr>';models.forEach(function(m){var c=vcolor(m.vendor);h+='<tr><td style="color:var(--text3);font-weight:700">'+m.rank+'</td><td style="color:'+c+'">'+m.display_name+'</td><td><span class="vpill" style="background:'+c+'18;color:'+c+'">'+m.vendor+'</span></td><td>'+m.intent_score+'</td><td><div class="lbar"><div class="lbf" style="width:'+m.intent_score+'%;background:'+c+'"></div></div></td></tr>';});h+='</table></div>';}lv.innerHTML=h;}catch(e){lv.innerHTML='<div class="err"><span>Backend not reachable</span></div>';}}

// ═══════════════════════════════════════════════════════════
// 5-STEP TUTORIAL
// ═══════════════════════════════════════════════════════════
var tutSteps = [
  {
    target: '.sidebar',
    title: 'Your Conversations',
    desc: 'All your chats live here. Click "+ New chat" to start fresh, or switch between past conversations. Your API keys are at the bottom.',
    pos: 'right'
  },
  {
    target: '.model-pick-btn',
    title: 'Pick a Model',
    desc: 'Click here to choose a specific AI model, or leave it on Auto to let TAP pick the best one for your prompt.',
    pos: 'bottom'
  },
  {
    target: '.tabs',
    title: 'Auto Routing & Leaderboard',
    desc: 'In Auto mode, TAP classifies your intent, ranks 7+ models on live benchmarks, and picks the winner. Switch to Leaderboard to see all rankings.',
    pos: 'bottom'
  },
  {
    target: '.inp-wrap',
    title: 'Type Your Prompt',
    desc: 'Enter any question or task here. TAP will detect the intent, select the best model, re-engineer your prompt, and stream the response — all in one step.',
    pos: 'top'
  },
  {
    target: '.keys-toggle',
    title: 'Add API Keys',
    desc: 'Paste your free API keys (Gemini, Groq, OpenRouter) to unlock models. No credit card needed. Keys are stored locally in your browser.',
    pos: 'top'
  }
];
var tutCurrent = 0;
var tutOverlay = null;

function tutHasSeen() {
  try { return localStorage.getItem('tap_tut_done') === '1'; } catch(e) { return false; }
}
function tutMarkDone() {
  try { localStorage.setItem('tap_tut_done', '1'); } catch(e) {}
}

function tutStart() {
  if (tutHasSeen()) return;
  tutCurrent = 0;
  // Create overlay
  tutOverlay = document.createElement('div');
  tutOverlay.className = 'tut-overlay';
  tutOverlay.innerHTML = '<div class="tut-backdrop"></div><div class="tut-highlight" id="tut-hl"></div><div class="tut-card" id="tut-card"></div>';
  document.body.appendChild(tutOverlay);
  // Make sure sidebar is open for step 0
  document.getElementById('sidebar').classList.remove('closed');
  setTimeout(function() { tutOverlay.classList.add('active'); tutShow(); }, 300);
}

function tutShow() {
  var step = tutSteps[tutCurrent];
  var el = document.querySelector(step.target);
  if (!el) { tutNext(); return; }
  var rect = el.getBoundingClientRect();
  var hl = document.getElementById('tut-hl');
  var card = document.getElementById('tut-card');
  var pad = 6;
  hl.style.top = (rect.top - pad) + 'px';
  hl.style.left = (rect.left - pad) + 'px';
  hl.style.width = (rect.width + pad*2) + 'px';
  hl.style.height = (rect.height + pad*2) + 'px';

  // Dots
  var dots = '';
  for (var i = 0; i < tutSteps.length; i++) dots += '<div class="tut-dot' + (i === tutCurrent ? ' active' : '') + '"></div>';

  var isLast = tutCurrent === tutSteps.length - 1;
  card.innerHTML =
    '<div class="tut-step-badge">Step ' + (tutCurrent+1) + ' of ' + tutSteps.length + '</div>' +
    '<div class="tut-title">' + step.title + '</div>' +
    '<div class="tut-desc">' + step.desc + '</div>' +
    '<div class="tut-actions">' +
      '<div class="tut-dots">' + dots + '</div>' +
      '<div class="tut-btns">' +
        '<button class="tut-btn skip" onclick="tutEnd()">Skip</button>' +
        '<button class="tut-btn next" onclick="' + (isLast ? 'tutEnd()' : 'tutNext()') + '">' + (isLast ? 'Got it!' : 'Next →') + '</button>' +
      '</div>' +
    '</div>';

  // Position the card relative to the highlight, clamped within viewport
  var cardW = 340, cardH = 200;
  var vpW = window.innerWidth, vpH = window.innerHeight;
  if (step.pos === 'right') {
    card.style.top = Math.min(rect.top, vpH - cardH - 12) + 'px';
    card.style.left = Math.min(rect.right + 16, vpW - cardW - 12) + 'px';
    card.style.bottom = 'auto'; card.style.right = 'auto';
  } else if (step.pos === 'bottom') {
    var cardTop = rect.bottom + 16;
    if (cardTop + cardH > vpH - 12) cardTop = Math.max(12, rect.top - cardH - 16);
    card.style.top = cardTop + 'px';
    card.style.left = Math.max(12, Math.min(rect.left - 40, vpW - cardW - 12)) + 'px';
    card.style.bottom = 'auto'; card.style.right = 'auto';
  } else if (step.pos === 'top') {
    var cardBottom = vpH - rect.top + 16;
    var cardTopCalc = rect.top - 16 - cardH;
    // If card goes above viewport, place it to the right of the element instead
    if (cardTopCalc < 12) {
      card.style.top = Math.max(12, Math.min(rect.top, vpH - cardH - 12)) + 'px';
      card.style.left = Math.min(rect.right + 16, vpW - cardW - 12) + 'px';
      card.style.bottom = 'auto'; card.style.right = 'auto';
    } else {
      card.style.bottom = Math.max(12, cardBottom) + 'px';
      card.style.left = Math.max(12, Math.min(rect.left, vpW - cardW - 12)) + 'px';
      card.style.top = 'auto'; card.style.right = 'auto';
    }
  }
}

function tutNext() {
  tutCurrent++;
  if (tutCurrent >= tutSteps.length) { tutEnd(); return; }
  tutShow();
}

function tutEnd() {
  tutMarkDone();
  if (tutOverlay) {
    tutOverlay.classList.remove('active');
    setTimeout(function() { if (tutOverlay) { tutOverlay.remove(); tutOverlay = null; } }, 300);
  }
}

// Launch tutorial on page load (first visit only)
setTimeout(tutStart, 1200);
</script>
