<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Router — Smart Model Routing</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  
  :root {
    --bg: #0f0f0f; --surface: #1a1a1a; --surface2: #242424; --border: #2e2e2e;
    --text: #e8e6e1; --text2: #9a9890; --text3: #5a5952;
    --accent: #6c63ff; --accent2: #4ecdc4; --accent3: #ff6b6b;
    --green: #4ecdc4; --blue: #6c63ff; --amber: #f0a500; --red: #ff6b6b; --pink: #e84393;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
  
  /* Header */
  .header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; background: var(--surface); }
  .logo { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
  .logo span { color: var(--accent); }
  .provider-dots { display: flex; gap: 6px; margin-left: auto; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text3); transition: background 0.3s; }
  .dot.active { background: var(--green); }
  .dot.limited { background: var(--amber); }
  .provider-label { font-size: 11px; color: var(--text3); font-family: 'JetBrains Mono', monospace; }

  /* Main chat area */
  .chat-area { flex: 1; overflow-y: auto; padding: 24px; max-width: 800px; width: 100%; margin: 0 auto; }
  
  /* Welcome screen */
  .welcome { text-align: center; padding: 80px 20px; }
  .welcome h2 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 8px; }
  .welcome p { color: var(--text2); font-size: 15px; max-width: 440px; margin: 0 auto 32px; line-height: 1.6; }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 600px; margin: 0 auto; }
  .example-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 16px; color: var(--text2); font-size: 13px; cursor: pointer; transition: all 0.15s; font-family: inherit; }
  .example-btn:hover { border-color: var(--accent); color: var(--text); background: rgba(108,99,255,0.08); }

  /* Messages */
  .message { margin-bottom: 24px; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .msg-user { display: flex; justify-content: flex-end; }
  .msg-user .bubble { background: var(--accent); color: #fff; border-radius: 16px 16px 4px 16px; padding: 12px 16px; max-width: 70%; font-size: 14px; line-height: 1.6; }
  .msg-bot { display: flex; flex-direction: column; gap: 8px; }
  .msg-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .intent-badge { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; }
  .intent-badge.code_generation { background: rgba(108,99,255,0.15); color: #9d97ff; }
  .intent-badge.code_review { background: rgba(108,99,255,0.15); color: #9d97ff; }
  .intent-badge.explanation { background: rgba(78,205,196,0.15); color: #4ecdc4; }
  .intent-badge.creative_writing { background: rgba(232,67,147,0.15); color: #e84393; }
  .intent-badge.research { background: rgba(240,165,0,0.15); color: #f0a500; }
  .intent-badge.math_reasoning { background: rgba(255,107,107,0.15); color: #ff6b6b; }
  .intent-badge.summarization { background: rgba(78,205,196,0.15); color: #4ecdc4; }
  .intent-badge.conversation { background: rgba(154,152,144,0.15); color: #9a9890; }
  .model-badge { font-size: 11px; color: var(--text2); font-family: 'JetBrains Mono', monospace; }
  .latency { font-size: 10px; color: var(--text3); font-family: 'JetBrains Mono', monospace; }
  .bubble-bot { background: var(--surface2); border: 1px solid var(--border); border-radius: 4px 16px 16px 16px; padding: 16px; max-width: 85%; font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-wrap: break-word; }
  .bubble-bot code { background: rgba(108,99,255,0.12); padding: 2px 6px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 13px; }
  .bubble-bot pre { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px; overflow-x: auto; margin: 8px 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 1.5; }
  
  /* Re-prompt toggle */
  .reprompt-toggle { font-size: 11px; color: var(--accent); cursor: pointer; background: none; border: none; font-family: inherit; padding: 2px 0; }
  .reprompt-toggle:hover { text-decoration: underline; }
  .reprompt-box { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-size: 12px; color: var(--text2); font-family: 'JetBrains Mono', monospace; line-height: 1.5; margin-top: 8px; white-space: pre-wrap; display: none; }
  .reprompt-box.show { display: block; }

  /* Loading */
  .loading-dots { display: flex; gap: 4px; padding: 12px 16px; }
  .loading-dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--text3); animation: blink 1.4s infinite; }
  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100% { opacity: 0.3; } 40% { opacity: 1; } }

  /* Input area */
  .input-area { border-top: 1px solid var(--border); padding: 16px 24px; background: var(--surface); }
  .input-wrap { max-width: 800px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  .input-controls { display: flex; gap: 8px; align-items: center; max-width: 800px; margin: 0 auto 10px; }
  .override-select { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; color: var(--text2); font-size: 12px; font-family: 'JetBrains Mono', monospace; cursor: pointer; }
  .override-select:focus { outline: none; border-color: var(--accent); }
  .override-label { font-size: 11px; color: var(--text3); }
  textarea { flex: 1; resize: none; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; color: var(--text); font-size: 14px; font-family: 'DM Sans', sans-serif; line-height: 1.5; min-height: 48px; max-height: 160px; }
  textarea:focus { outline: none; border-color: var(--accent); }
  textarea::placeholder { color: var(--text3); }
  .send-btn { width: 48px; height: 48px; border-radius: 12px; border: none; background: var(--accent); color: #fff; font-size: 18px; cursor: pointer; transition: all 0.15s; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .send-btn:hover { background: #5a52e0; transform: scale(1.05); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* Error */
  .error-msg { background: rgba(255,107,107,0.1); border: 1px solid rgba(255,107,107,0.3); border-radius: 10px; padding: 12px 16px; color: var(--red); font-size: 13px; margin-bottom: 16px; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">AI <span>Router</span></div>
  <div style="display:flex;align-items:center;gap:12px;margin-left:auto;">
    <div style="display:flex;align-items:center;gap:6px;">
      <div class="dot" id="dot-claude"></div><span class="provider-label">Claude</span>
    </div>
    <div style="display:flex;align-items:center;gap:6px;">
      <div class="dot" id="dot-gemini"></div><span class="provider-label">Gemini</span>
    </div>
    <div style="display:flex;align-items:center;gap:6px;">
      <div class="dot" id="dot-groq"></div><span class="provider-label">Groq</span>
    </div>
  </div>
</div>

<div class="chat-area" id="chatArea">
  <div class="welcome" id="welcome">
    <h2>What can I route for you?</h2>
    <p>Type a prompt and I'll detect the intent, pick the best model, optimize your prompt, and get the answer — all automatically.</p>
    <div class="examples">
      <button class="example-btn" onclick="useExample(this)">Write a Python script to parse a CSV and find duplicate rows</button>
      <button class="example-btn" onclick="useExample(this)">Explain how TCP/IP works in simple terms</button>
      <button class="example-btn" onclick="useExample(this)">Compare React vs Vue for a new project</button>
      <button class="example-btn" onclick="useExample(this)">Solve: integral of x²·sin(x) dx</button>
      <button class="example-btn" onclick="useExample(this)">Write a short story about a robot learning to paint</button>
    </div>
  </div>
</div>

<div class="input-area">
  <div class="input-controls">
    <span class="override-label">Model override:</span>
    <select class="override-select" id="overrideSelect">
      <option value="">Auto (best for intent)</option>
      <option value="claude">Force Claude</option>
      <option value="gemini">Force Gemini</option>
      <option value="groq">Force Groq</option>
    </select>
  </div>
  <div class="input-wrap">
    <textarea id="promptInput" placeholder="Type your prompt..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">→</button>
  </div>
</div>

<script>
const API = 'http://localhost:8000';
const chatArea = document.getElementById('chatArea');
const welcome = document.getElementById('welcome');
const input = document.getElementById('promptInput');
const sendBtn = document.getElementById('sendBtn');
const overrideSelect = document.getElementById('overrideSelect');
let isLoading = false;

// Check health on load
async function checkHealth() {
  try {
    const res = await fetch(`${API}/health`);
    const data = await res.json();
    ['claude','gemini','groq'].forEach(p => {
      const dot = document.getElementById(`dot-${p}`);
      if (data.providers[p]) {
        dot.classList.add('active');
        if (data.limited_providers.includes(p)) {
          dot.classList.remove('active');
          dot.classList.add('limited');
        }
      }
    });
  } catch (e) {
    console.log('Backend not reachable — make sure uvicorn is running on port 8000');
  }
}
checkHealth();
setInterval(checkHealth, 30000);

function useExample(btn) {
  input.value = btn.textContent;
  autoResize(input);
  input.focus();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}

function addMessage(html) {
  if (welcome) welcome.style.display = 'none';
  chatArea.insertAdjacentHTML('beforeend', html);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function formatResponse(text) {
  // Basic markdown-like formatting for code blocks
  text = text.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  return text;
}

async function sendMessage() {
  const prompt = input.value.trim();
  if (!prompt || isLoading) return;
  
  isLoading = true;
  sendBtn.disabled = true;
  input.value = '';
  autoResize(input);

  // Show user message
  addMessage(`<div class="message msg-user"><div class="bubble">${escapeHtml(prompt)}</div></div>`);

  // Show loading
  const loadingId = 'loading-' + Date.now();
  addMessage(`<div class="message msg-bot" id="${loadingId}"><div class="loading-dots"><span></span><span></span><span></span></div></div>`);

  try {
    const override = overrideSelect.value || null;
    const res = await fetch(`${API}/api/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt, override_provider: override }),
    });

    const loadingEl = document.getElementById(loadingId);
    
    if (!res.ok) {
      const err = await res.json();
      loadingEl.innerHTML = `<div class="error-msg">Error: ${err.detail || 'Something went wrong'}</div>`;
      return;
    }

    const data = await res.json();
    const repromptId = 'rp-' + Date.now();

    loadingEl.innerHTML = `
      <div class="msg-meta">
        <span class="intent-badge ${data.intent}">${data.intent.replace('_', ' ')}</span>
        <span class="model-badge">→ ${data.model_display_name}</span>
        <span class="latency">${data.latency_ms}ms</span>
        <button class="reprompt-toggle" onclick="document.getElementById('${repromptId}').classList.toggle('show')">
          view optimized prompt
        </button>
      </div>
      <div class="reprompt-box" id="${repromptId}">${escapeHtml(data.reprompted_prompt)}</div>
      <div class="bubble-bot">${formatResponse(escapeHtml(data.response))}</div>
    `;
    chatArea.scrollTop = chatArea.scrollHeight;
    checkHealth(); // Refresh provider status

  } catch (e) {
    const loadingEl = document.getElementById(loadingId);
    loadingEl.innerHTML = `<div class="error-msg">Could not reach the backend. Is uvicorn running on port 8000?</div>`;
  } finally {
    isLoading = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}
</script>
</body>
</html>
