<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Router</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
:root{--bg:#0c0c0c;--surface:#161616;--surface2:#1e1e1e;--surface3:#282828;--border:#2a2a2a;--text:#e8e6e1;--text2:#9a9890;--text3:#555;--accent:#6c63ff;--green:#4ecdc4;--amber:#f0a500;--red:#ff6b6b;--pink:#e84393;--blue:#4a9eff;--claude:#e84393;--gemini:#4a9eff;--groq:#f0a500}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
.header{padding:10px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;background:var(--surface)}
.logo{font-size:17px;font-weight:700;letter-spacing:-.5px}.logo span{color:var(--accent)}
.tabs{display:flex;gap:3px;margin-left:20px}
.tab{background:none;border:none;color:var(--text3);font-family:inherit;font-size:12px;font-weight:500;padding:5px 12px;border-radius:7px;cursor:pointer;transition:.15s}
.tab:hover{color:var(--text2)}.tab.on{background:var(--accent);color:#fff}
.dots{display:flex;gap:10px;margin-left:auto;align-items:center}
.prov{display:flex;align-items:center;gap:4px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--text3);transition:.3s}
.dot.ok{background:var(--green)}.dot.lim{background:var(--amber)}
.plbl{font-size:10px;color:var(--text3);font-family:'JetBrains Mono',monospace}
.main{flex:1;overflow:hidden;display:flex;flex-direction:column}
.chat{flex:1;overflow-y:auto;padding:20px;max-width:820px;width:100%;margin:0 auto}
.lb-view{flex:1;overflow-y:auto;padding:20px;max-width:900px;width:100%;margin:0 auto;display:none}
.welcome{text-align:center;padding:50px 20px}
.welcome h2{font-size:24px;font-weight:700;letter-spacing:-.5px;margin-bottom:6px}
.welcome p{color:var(--text2);font-size:13px;max-width:440px;margin:0 auto 20px;line-height:1.6}
.exs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:600px;margin:0 auto}
.ex{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:8px 13px;color:var(--text2);font-size:11px;cursor:pointer;transition:.15s;font-family:inherit}
.ex:hover{border-color:var(--accent);color:var(--text)}
.msg{margin-bottom:20px;animation:fi .3s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.mu{display:flex;justify-content:flex-end}
.mu .bub{background:var(--accent);color:#fff;border-radius:14px 14px 4px 14px;padding:10px 14px;max-width:70%;font-size:13px;line-height:1.6}
.mb{display:flex;flex-direction:column;gap:6px}
.selector-anim{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;overflow:hidden}
.phase-label{font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--green);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.phase-label .spinner{width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.model-slots{display:flex;flex-direction:column;gap:4px}
.slot{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:8px;background:var(--surface2);border:1px solid transparent;transition:all .3s;opacity:.3}
.slot.scanning{opacity:1;border-color:var(--border);animation:pulse .4s ease}
.slot.winner{opacity:1;border-color:var(--green);background:rgba(78,205,196,.06);transform:scale(1.02)}
.slot.rejected{opacity:.15;transform:scale(.97)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(78,205,196,.3)}100%{box-shadow:0 0 0 8px transparent}}
.slot-rank{font-size:10px;color:var(--text3);font-family:'JetBrains Mono',monospace;width:18px;text-align:center}
.slot-name{font-size:12px;font-weight:600;flex:1;min-width:0}
.slot-name.claude{color:var(--claude)}.slot-name.gemini{color:var(--gemini)}.slot-name.groq{color:var(--groq)}
.slot-score{font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--text2);min-width:35px;text-align:right}
.slot-bar{width:90px;height:5px;border-radius:3px;background:var(--surface3);overflow:hidden;flex-shrink:0}
.slot-fill{height:100%;border-radius:3px;transition:width .4s ease}
.slot-fill.claude{background:var(--claude)}.slot-fill.gemini{background:var(--gemini)}.slot-fill.groq{background:var(--groq)}
.slot-check{font-size:13px;opacity:0;transition:opacity .3s;flex-shrink:0;width:16px}
.slot.winner .slot-check{opacity:1}
.bench-src{font-size:9px;color:var(--text3);font-family:'JetBrains Mono',monospace;margin-top:8px}
.bench-src a{color:var(--accent);text-decoration:none}
.trans{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:11px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:5px;font-family:'JetBrains Mono',monospace}
.badge.intent{background:rgba(108,99,255,.15);color:#9d97ff}
.badge.model{background:rgba(74,158,255,.12);color:var(--blue)}
.badge.score{background:rgba(78,205,196,.1);color:var(--green)}
.badge.time{background:rgba(154,152,144,.1);color:var(--text2)}
.toggle-btn{font-size:10px;color:var(--accent);cursor:pointer;background:none;border:none;font-family:inherit}
.toggle-btn:hover{text-decoration:underline}
.rp-box{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:10px;font-size:10px;color:var(--text2);font-family:'JetBrains Mono',monospace;line-height:1.5;white-space:pre-wrap;display:none;width:100%;margin-top:6px}
.rp-box.show{display:block}
.bbot{background:var(--surface2);border:1px solid var(--border);border-radius:4px 14px 14px 14px;padding:14px;max-width:85%;font-size:13px;line-height:1.7;white-space:pre-wrap;word-wrap:break-word}
.bbot code{background:rgba(108,99,255,.12);padding:2px 5px;border-radius:3px;font-family:'JetBrains Mono',monospace;font-size:12px}
.bbot pre{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:12px;overflow-x:auto;margin:6px 0;font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.5}
.inp{border-top:1px solid var(--border);padding:12px 20px;background:var(--surface)}
.inp-ctrl{display:flex;gap:8px;align-items:center;max-width:820px;margin:0 auto 8px}
.olbl{font-size:10px;color:var(--text3)}
.osel{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:5px 9px;color:var(--text2);font-size:11px;font-family:'JetBrains Mono',monospace;cursor:pointer}
.osel:focus{outline:none;border-color:var(--accent)}
.inp-row{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif;line-height:1.5;min-height:44px;max-height:140px}
textarea:focus{outline:none;border-color:var(--accent)}textarea::placeholder{color:var(--text3)}
.sbtn{width:44px;height:44px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:16px;cursor:pointer;transition:.15s;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.sbtn:hover{background:#5a52e0;transform:scale(1.04)}.sbtn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.err{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.3);border-radius:9px;padding:10px 14px;color:var(--red);font-size:12px}
.lbh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.lbh h2{font-size:18px;font-weight:700}
.lbsrc{font-size:10px;color:var(--text3);font-family:'JetBrains Mono',monospace}
.lbr{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:5px 12px;color:var(--text2);font-size:11px;cursor:pointer;font-family:inherit;transition:.15s}
.lbr:hover{border-color:var(--accent);color:var(--text)}
.lbs{margin-bottom:20px}.lbs h3{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:8px;text-transform:capitalize}
.lt{width:100%;border-collapse:collapse;font-size:11px}
.lt th{text-align:left;color:var(--text3);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--border);font-family:'JetBrains Mono',monospace;font-size:10px}
.lt td{padding:6px 8px;border-bottom:1px solid rgba(42,42,42,.5);color:var(--text2)}
.lt tr:first-child td{color:var(--green);font-weight:600}
.lbar{width:100%;height:6px;border-radius:3px;background:var(--surface3);overflow:hidden}
.lbf{height:100%;border-radius:3px}
.lbf.claude{background:var(--claude)}.lbf.gemini{background:var(--gemini)}.lbf.groq{background:var(--groq)}
.lprov{font-size:9px;padding:2px 5px;border-radius:3px;font-family:'JetBrains Mono',monospace}
.lprov.claude{background:rgba(232,67,147,.15);color:var(--claude)}
.lprov.gemini{background:rgba(74,158,255,.15);color:var(--gemini)}
.lprov.groq{background:rgba(240,165,0,.15);color:var(--groq)}
</style>
</head>
<body>
<div class="header">
  <div class="logo">AI <span>Router</span></div>
  <div class="tabs"><button class="tab on" onclick="showTab('chat',this)">Chat</button><button class="tab" onclick="showTab('lb',this)">Leaderboard</button></div>
  <div class="dots">
    <div class="prov"><div class="dot" id="d-claude"></div><span class="plbl">Claude</span></div>
    <div class="prov"><div class="dot" id="d-gemini"></div><span class="plbl">Gemini</span></div>
    <div class="prov"><div class="dot" id="d-groq"></div><span class="plbl">Groq</span></div>
  </div>
</div>
<div class="main">
  <div class="chat" id="cv">
    <div class="welcome" id="wel">
      <h2>What can I route for you?</h2>
      <p>Type a prompt. Watch the AI scan the leaderboard, evaluate each model, pick the best one — then generate your answer.</p>
      <div class="exs">
        <button class="ex" onclick="useEx(this)">Write a Python script to parse CSV and find duplicates</button>
        <button class="ex" onclick="useEx(this)">Explain how TCP/IP works in simple terms</button>
        <button class="ex" onclick="useEx(this)">Compare React vs Vue for a new project</button>
        <button class="ex" onclick="useEx(this)">Solve: integral of x²·sin(x) dx</button>
        <button class="ex" onclick="useEx(this)">Write a short story about a robot learning to paint</button>
      </div>
    </div>
  </div>
  <div class="lb-view" id="lv"></div>
</div>
<div class="inp" id="ia">
  <div class="inp-ctrl"><span class="olbl">Override:</span>
    <select class="osel" id="os"><option value="">Auto (leaderboard picks)</option><option value="claude">Force Claude</option><option value="gemini">Force Gemini</option><option value="groq">Force Groq</option></select>
  </div>
  <div class="inp-row">
    <textarea id="pi" placeholder="Type your prompt..." rows="1" onkeydown="hk(event)" oninput="ar(this)"></textarea>
    <button class="sbtn" id="sb" onclick="send()">&#x2192;</button>
  </div>
</div>
<script>
const API='http://localhost:8000',cv=document.getElementById('cv'),wel=document.getElementById('wel'),
  pi=document.getElementById('pi'),sb=document.getElementById('sb'),os=document.getElementById('os');
let busy=false;
function showTab(t,btn){document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));btn.classList.add('on');
  cv.style.display=t==='chat'?'block':'none';document.getElementById('lv').style.display=t==='lb'?'block':'none';
  document.getElementById('ia').style.display=t==='chat'?'block':'none';if(t==='lb')loadLB();}
async function checkH(){try{const r=await(await fetch(API+'/health')).json();
  ['claude','gemini','groq'].forEach(p=>{const d=document.getElementById('d-'+p);
    d.className='dot'+(r.providers[p]?(r.limited?.includes(p)?' lim':' ok'):'');});}catch(e){}}
checkH();setInterval(checkH,30000);
function useEx(b){pi.value=b.textContent;ar(pi);pi.focus();}
function hk(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}
function ar(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,140)+'px';}
function add(h){if(wel)wel.style.display='none';cv.insertAdjacentHTML('beforeend',h);cv.scrollTop=cv.scrollHeight;}
function esc(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML;}
function fmt(t){t=t.replace(/```(\w*)\n([\s\S]*?)```/g,'<pre><code>$2</code></pre>');return t.replace(/`([^`]+)`/g,'<code>$1</code>');}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

async function send(){
  const prompt=pi.value.trim();if(!prompt||busy)return;
  busy=true;sb.disabled=true;pi.value='';ar(pi);
  add('<div class="msg mu"><div class="bub">'+esc(prompt)+'</div></div>');
  const id='m'+Date.now();
  add('<div class="msg mb" id="'+id+'"></div>');
  const el=document.getElementById(id);
  try{
    // STEP 1: Show analyzing state
    el.innerHTML='<div class="selector-anim" id="sa-'+id+'"><div class="phase-label"><div class="spinner"></div> Analyzing your prompt...</div><div class="model-slots" id="slots-'+id+'"></div></div>';
    cv.scrollTop=cv.scrollHeight;

    const override=os.value||null;
    const aRes=await fetch(API+'/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({prompt:prompt,override_provider:override})});
    if(!aRes.ok){const e=await aRes.json();throw new Error(e.detail||'Analyze failed');}
    const a=await aRes.json();

    // STEP 2: Animated model selection
    await animateSelection(id,a);

    // STEP 3: Call LLM
    const sa=document.getElementById('sa-'+id);
    const ph=sa.querySelector('.phase-label');
    ph.innerHTML='<div class="spinner"></div> <span style="color:var(--text)">'+a.selected_display_name+'</span> is generating response...';
    cv.scrollTop=cv.scrollHeight;

    const gRes=await fetch(API+'/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({reprompted_prompt:a.reprompted_prompt,provider:a.selected_provider,
        model_id:a.selected_model_id,original_prompt:prompt,intent:a.intent})});
    if(!gRes.ok){const e=await gRes.json();throw new Error(e.detail||'Generate failed');}
    const g=await gRes.json();

    // STEP 4: Show final result
    const rpId='rp'+Date.now();
    el.innerHTML=
      '<div class="trans">'+
        '<span class="badge intent">'+a.intent.replace(/_/g,' ')+'</span>'+
        '<span style="color:var(--text3);font-size:10px">&#x2192; '+a.benchmark_name+' &#x2192;</span>'+
        '<span class="badge model">'+g.model_display_name+'</span>'+
        '<span class="badge score">#'+a.rank+' of '+a.total_candidates+' &middot; score '+a.intent_score+'</span>'+
        '<span class="badge time">'+g.latency_ms+'ms</span>'+
        (g.failover_from?'<span class="badge" style="background:rgba(255,107,107,.1);color:var(--red)">failover from '+g.failover_from+'</span>':'')+
        '<button class="toggle-btn" onclick="document.getElementById(\''+rpId+'\').classList.toggle(\'show\')">&#9656; optimized prompt</button>'+
        '<div class="rp-box" id="'+rpId+'">'+esc(a.reprompted_prompt)+'</div>'+
      '</div>'+
      '<div class="bbot">'+fmt(esc(g.response))+'</div>';
    cv.scrollTop=cv.scrollHeight;checkH();
  }catch(e){el.innerHTML='<div class="err">'+esc(e.message||'Backend not reachable')+'</div>';}
  finally{busy=false;sb.disabled=false;pi.focus();}
}

async function animateSelection(id,a){
  const slotsEl=document.getElementById('slots-'+id);
  const sa=document.getElementById('sa-'+id);
  const ph=sa.querySelector('.phase-label');
  const rk=a.all_rankings;
  const win=a.selected_model_id;

  // Phase 1: Intent detected
  ph.innerHTML='<div class="spinner"></div> Intent: <span style="color:var(--accent);font-weight:600">'+a.intent.replace(/_/g,' ')+'</span> &mdash; scanning leaderboard...';
  await sleep(500);

  // Phase 2: Show benchmark being used
  ph.innerHTML='<div class="spinner"></div> Evaluating '+rk.length+' models on <span style="color:var(--green)">'+a.benchmark_name+'</span>';

  // Build hidden slots
  let shtml='';
  for(let i=0;i<rk.length;i++){
    shtml+='<div class="slot" id="slot-'+id+'-'+i+'" data-m="'+rk[i].model_id+'">'+
      '<span class="slot-rank">#'+rk[i].rank+'</span>'+
      '<span class="slot-name '+rk[i].provider+'">'+rk[i].display_name+'</span>'+
      '<div class="slot-bar"><div class="slot-fill '+rk[i].provider+'" style="width:0%"></div></div>'+
      '<span class="slot-score" style="opacity:0">'+rk[i].intent_score+'</span>'+
      '<span class="slot-check">&#x2713;</span></div>';
  }
  slotsEl.innerHTML=shtml;

  // Animate each slot: appear + bar fills
  for(let i=0;i<rk.length;i++){
    const s=document.getElementById('slot-'+id+'-'+i);
    s.classList.add('scanning');
    await sleep(120);
    s.querySelector('.slot-fill').style.width=rk[i].intent_score+'%';
    s.querySelector('.slot-score').style.opacity='1';
    await sleep(220);
    cv.scrollTop=cv.scrollHeight;
  }
  await sleep(300);

  // Phase 3: Pick winner
  ph.innerHTML='<div class="spinner"></div> Selecting best model...';
  await sleep(350);

  for(let i=0;i<rk.length;i++){
    const s=document.getElementById('slot-'+id+'-'+i);
    s.classList.remove('scanning');
    s.classList.add(rk[i].model_id===win?'winner':'rejected');
  }

  ph.innerHTML='&#x2713; <span style="color:var(--green);font-weight:600">'+a.selected_display_name+'</span> &mdash; '+a.selection_reason;

  const src=document.createElement('div');
  src.className='bench-src';
  src.innerHTML='Source: <a href="'+a.source_url+'" target="_blank">'+a.data_source+'</a>';
  slotsEl.after(src);
  await sleep(400);
  cv.scrollTop=cv.scrollHeight;
}

async function loadLB(){
  const lv=document.getElementById('lv');
  try{const lb=await(await fetch(API+'/api/leaderboard')).json();
    const cats={code_generation:'Coding',code_review:'Code Review',explanation:'Explanation',creative_writing:'Creative Writing',research:'Research',math_reasoning:'Math',summarization:'Speed / Summary',conversation:'Conversation'};
    let h='<div class="lbh"><div><h2>Model Leaderboard</h2><div class="lbsrc">Source: <a href="'+lb.source_url+'" target="_blank" style="color:var(--accent)">'+lb.source+'</a></div></div><button class="lbr" onclick="loadLB()">&#x21bb; Refresh</button></div>';
    h+='<div class="lbs"><h3>Overall ELO</h3><table class="lt"><tr><th>#</th><th>Model</th><th>Provider</th><th>ELO</th><th style="width:180px"></th></tr>';
    lb.overall.forEach(function(m,i){var p=((m.overall_elo-1000)/400*100).toFixed(0);
      h+='<tr><td style="color:var(--text3);font-weight:700">'+(i+1)+'</td><td>'+m.display_name+'</td><td><span class="lprov '+m.provider+'">'+m.provider+'</span></td><td>'+m.overall_elo+'</td><td><div class="lbar"><div class="lbf '+m.provider+'" style="width:'+p+'%"></div></div></td></tr>';});
    h+='</table></div>';
    for(var cat in lb.by_category){var models=lb.by_category[cat];
      h+='<div class="lbs"><h3>'+(cats[cat]||cat)+'</h3><table class="lt"><tr><th>#</th><th>Model</th><th>Provider</th><th>Score</th><th style="width:180px"></th></tr>';
      models.forEach(function(m){h+='<tr><td style="color:var(--text3);font-weight:700">'+m.rank+'</td><td>'+m.display_name+'</td><td><span class="lprov '+m.provider+'">'+m.provider+'</span></td><td>'+m.intent_score+'</td><td><div class="lbar"><div class="lbf '+m.provider+'" style="width:'+m.intent_score+'%"></div></div></td></tr>';});
      h+='</table></div>';}
    lv.innerHTML=h;
  }catch(e){lv.innerHTML='<div class="err">Backend not reachable</div>';}
}
</script>
</body>
</html>
