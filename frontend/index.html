<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAP — AI Router</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
:root{
  --bg:#0c0c0c;--surface:#161616;--surface2:#1e1e1e;--surface3:#282828;--border:#2a2a2a;
  --text:#e8e6e1;--text2:#9a9890;--text3:#555;--accent:#6c63ff;--green:#4ecdc4;--red:#ff6b6b;
  /* Brand colors — logo-accurate */
  --anthropic:#D97757;--google:#4285F4;--meta:#0668E1;--deepseek:#536DFE;
  --mistral:#FF7000;--qwen:#6F42C1;--openrouter:#9a9890;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
.hdr{padding:10px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;background:var(--surface);flex-wrap:wrap}
.logo{font-size:17px;font-weight:700;letter-spacing:-.5px}.logo span{color:var(--accent)}
.tabs{display:flex;gap:3px;margin-left:16px}
.tab{background:none;border:none;color:var(--text3);font-family:inherit;font-size:12px;font-weight:500;padding:5px 12px;border-radius:7px;cursor:pointer;transition:.15s}
.tab:hover{color:var(--text2)}.tab.on{background:var(--accent);color:#fff}
.dots{display:flex;gap:8px;margin-left:auto;align-items:center;flex-wrap:wrap}
.prov{display:flex;align-items:center;gap:3px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--text3);transition:.3s}
.dot.ok{background:var(--green)}.dot.lim{background:var(--mistral)}
.plbl{font-size:9px;color:var(--text3);font-family:'JetBrains Mono',monospace}
.main{flex:1;overflow:hidden;display:flex;flex-direction:column}
.chat{flex:1;overflow-y:auto;padding:20px;max-width:840px;width:100%;margin:0 auto}
.lb-view{flex:1;overflow-y:auto;padding:20px;max-width:940px;width:100%;margin:0 auto;display:none}
.welcome{text-align:center;padding:44px 20px}
.welcome h2{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-bottom:6px}
.welcome p{color:var(--text2);font-size:13px;max-width:460px;margin:0 auto 18px;line-height:1.6}
.exs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:620px;margin:0 auto}
.ex{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:7px 12px;color:var(--text2);font-size:11px;cursor:pointer;transition:.15s;font-family:inherit}
.ex:hover{border-color:var(--accent);color:var(--text)}
.msg{margin-bottom:18px;animation:fi .3s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.mu{display:flex;justify-content:flex-end}
.mu .bub{background:var(--accent);color:#fff;border-radius:14px 14px 4px 14px;padding:10px 14px;max-width:70%;font-size:13px;line-height:1.5}
.mb{display:flex;flex-direction:column;gap:6px}
.sa{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;overflow:hidden}
.ph{font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--green);margin-bottom:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ph .sp{width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.slots{display:flex;flex-direction:column;gap:3px}
.slot{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:7px;background:var(--surface2);border:1px solid transparent;transition:all .3s;opacity:.25}
.slot.scanning{opacity:1;border-color:var(--border)}
.slot.winner{opacity:1;border-color:var(--green);background:rgba(78,205,196,.06);transform:scale(1.01)}
.slot.rejected{opacity:.12;transform:scale(.97)}
.s-rank{font-size:9px;color:var(--text3);font-family:'JetBrains Mono',monospace;width:16px;text-align:center}
.s-name{font-size:11px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-bar{width:80px;height:4px;border-radius:2px;background:var(--surface3);overflow:hidden;flex-shrink:0}
.s-fill{height:100%;border-radius:2px;transition:width .4s ease}
.s-score{font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--text2);min-width:30px;text-align:right}
.s-chk{font-size:12px;opacity:0;transition:opacity .3s;flex-shrink:0;width:14px}
.slot.winner .s-chk{opacity:1}
.bsrc{font-size:8px;color:var(--text3);font-family:'JetBrains Mono',monospace;margin-top:6px}
.bsrc a{color:var(--accent);text-decoration:none}
.trans{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:9px 11px;font-size:10px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.bdg{font-size:9px;font-weight:600;padding:2px 7px;border-radius:4px;font-family:'JetBrains Mono',monospace}
.bdg.intent{background:rgba(108,99,255,.15);color:#9d97ff}
.bdg.model{padding:2px 7px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-weight:600;font-size:9px}
.bdg.score{background:rgba(78,205,196,.1);color:var(--green)}
.bdg.time{background:rgba(154,152,144,.1);color:var(--text2)}
.bdg.std{background:rgba(108,99,255,.08);color:#8a84ff}
.tgl{font-size:9px;color:var(--accent);cursor:pointer;background:none;border:none;font-family:inherit}
.tgl:hover{text-decoration:underline}
.rp{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px;font-size:9px;color:var(--text2);font-family:'JetBrains Mono',monospace;line-height:1.5;white-space:pre-wrap;display:none;width:100%;margin-top:4px;max-height:200px;overflow-y:auto}
.rp.show{display:block}
.bbot{background:var(--surface2);border:1px solid var(--border);border-radius:4px 14px 14px 14px;padding:13px;max-width:88%;font-size:13px;line-height:1.7;word-wrap:break-word}
.bbot code{background:rgba(108,99,255,.12);padding:1px 4px;border-radius:3px;font-family:'JetBrains Mono',monospace;font-size:12px}
.bbot pre{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:0;overflow:hidden;margin:8px 0;position:relative}
.bbot pre .code-header{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:var(--surface3);border-bottom:1px solid var(--border);font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text3)}
.bbot pre .copy-btn{background:none;border:1px solid var(--border);border-radius:4px;padding:2px 8px;color:var(--text2);font-size:10px;font-family:'JetBrains Mono',monospace;cursor:pointer;transition:.15s}
.bbot pre .copy-btn:hover{border-color:var(--accent);color:var(--accent)}
.bbot pre .copy-btn.copied{border-color:var(--green);color:var(--green)}
.bbot pre code{display:block;padding:12px;overflow-x:auto;font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.5;background:transparent}
.bbot h1,.bbot h2,.bbot h3{font-size:14px;font-weight:600;color:var(--text);margin:12px 0 6px;line-height:1.4}
.bbot h1{font-size:15px} .bbot h2{font-size:14px} .bbot h3{font-size:13px}
.bbot p{margin:4px 0 8px}
.bbot ul,.bbot ol{padding-left:20px;margin:4px 0 8px}
.bbot li{margin:2px 0;line-height:1.6}
.bbot strong,.bbot b{color:var(--text);font-weight:600}
.bbot hr{border:none;border-top:1px solid var(--border);margin:10px 0}
.inp{border-top:1px solid var(--border);padding:10px 20px;background:var(--surface)}
.inp-c{display:flex;gap:8px;align-items:center;max-width:840px;margin:0 auto 6px}
.olbl{font-size:9px;color:var(--text3)}
.osel{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:4px 8px;color:var(--text2);font-size:10px;font-family:'JetBrains Mono',monospace;cursor:pointer}
.osel:focus{outline:none;border-color:var(--accent)}
.inp-r{max-width:840px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif;line-height:1.5;min-height:42px;max-height:140px}
textarea:focus{outline:none;border-color:var(--accent)}textarea::placeholder{color:var(--text3)}
.sbtn{width:42px;height:42px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:15px;cursor:pointer;transition:.15s;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.sbtn:hover{background:#5a52e0;transform:scale(1.04)}.sbtn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.err{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.3);border-radius:8px;padding:9px 12px;color:var(--red);font-size:11px}
/* Leaderboard */
.lbh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.lbh h2{font-size:17px;font-weight:700}.lbsrc{font-size:9px;color:var(--text3);font-family:'JetBrains Mono',monospace}
.lbr{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:4px 10px;color:var(--text2);font-size:10px;cursor:pointer;font-family:inherit;transition:.15s}
.lbr:hover{border-color:var(--accent);color:var(--text)}
.lbs{margin-bottom:18px}.lbs h3{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;text-transform:capitalize}
.lt{width:100%;border-collapse:collapse;font-size:10px}
.lt th{text-align:left;color:var(--text3);font-weight:500;padding:5px 6px;border-bottom:1px solid var(--border);font-family:'JetBrains Mono',monospace;font-size:9px}
.lt td{padding:5px 6px;border-bottom:1px solid rgba(42,42,42,.4);color:var(--text2)}
.lt tr:first-child td{font-weight:600}
.lbar{width:100%;height:6px;border-radius:3px;background:var(--surface3);overflow:hidden}
.lbf{height:100%;border-radius:3px}
.vpill{font-size:8px;padding:1px 5px;border-radius:3px;font-family:'JetBrains Mono',monospace;font-weight:600}
</style>
</head>
<body>
<div class="hdr">
  <div class="logo"><span>TAP</span></div>
  <div class="tabs"><button class="tab on" onclick="showTab('chat',this)">Chat</button><button class="tab" onclick="showTab('lb',this)">Leaderboard</button></div>
  <div class="dots">
    <div class="prov"><div class="dot" id="d-claude"></div><span class="plbl">Claude</span></div>
    <div class="prov"><div class="dot" id="d-gemini"></div><span class="plbl">Gemini</span></div>
    <div class="prov"><div class="dot" id="d-groq"></div><span class="plbl">Groq</span></div>
    <div class="prov"><div class="dot" id="d-openrouter"></div><span class="plbl">OpenRouter</span></div>
  </div>
</div>
<div class="main">
  <div class="chat" id="cv">
    <div class="welcome" id="wel">
      <h2>You had the right question all along, we just tapped into it.</h2>
      <p>You bring the thought. TAP does the rest — ranking seven models by live benchmark scores, selecting the sharpest one, refining your prompt, and delivering an answer worth having.</p>
      <div class="exs">
        <button class="ex" onclick="useEx(this)">Write a Python script to parse CSV and find duplicates</button>
        <button class="ex" onclick="useEx(this)">Explain how TCP/IP works in simple terms</button>
        <button class="ex" onclick="useEx(this)">Compare React vs Vue for a new project</button>
        <button class="ex" onclick="useEx(this)">Solve: integral of x²·sin(x) dx</button>
        <button class="ex" onclick="useEx(this)">Write a short story about a robot learning to paint</button>
      </div>
    </div>
  </div>
  <div class="lb-view" id="lv"></div>
</div>
<div class="inp" id="ia">
  <div class="inp-c"><span class="olbl">Override:</span>
    <select class="osel" id="os"><option value="">Auto (leaderboard)</option><option value="claude">Claude</option><option value="gemini">Gemini</option><option value="groq">Groq</option><option value="openrouter">OpenRouter</option></select>
  </div>
  <div class="inp-r">
    <textarea id="pi" placeholder="Type your prompt..." rows="1" onkeydown="hk(event)" oninput="ar(this)"></textarea>
    <button class="sbtn" id="sb" onclick="send()">&#x2192;</button>
  </div>
</div>
<script>
const API='http://localhost:8000';
const cv=document.getElementById('cv'),wel=document.getElementById('wel'),pi=document.getElementById('pi'),sb=document.getElementById('sb'),os=document.getElementById('os');
let busy=false;

// Brand colors per vendor
const VC={anthropic:'#D97757',google:'#4285F4',meta:'#0668E1',deepseek:'#536DFE',mistral:'#FF7000',qwen:'#6F42C1',groq:'#F0A500',openrouter:'#9a9890',generic:'#888'};
function vcolor(v){return VC[v]||VC.generic;}
function vbg(v){return vcolor(v)+'18';}

function showTab(t,btn){document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));btn.classList.add('on');
  cv.style.display=t==='chat'?'block':'none';document.getElementById('lv').style.display=t==='lb'?'block':'none';
  document.getElementById('ia').style.display=t==='chat'?'block':'none';if(t==='lb')loadLB();}
async function checkH(){try{const r=await(await fetch(API+'/health')).json();
  ['claude','gemini','groq','openrouter'].forEach(p=>{const d=document.getElementById('d-'+p);
    d.className='dot'+(r.providers[p]?(r.limited?.includes(p)?' lim':' ok'):'');});}catch(e){}}
checkH();setInterval(checkH,30000);
function useEx(b){pi.value=b.textContent;ar(pi);pi.focus();}
function hk(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}
function ar(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,140)+'px';}
function add(h){if(wel)wel.style.display='none';cv.insertAdjacentHTML('beforeend',h);cv.scrollTop=cv.scrollHeight;}
function esc(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML;}

function fmt(t){
  // Code blocks with language detection and copy button
  let codeId=0;
  t=t.replace(/```(\w*)\n([\s\S]*?)```/g,function(_,lang,code){
    const id='cb'+(++codeId)+Date.now();
    const label=lang||'code';
    return '<pre><div class="code-header"><span>'+label+'</span><button class="copy-btn" onclick="copyCode(\''+id+'\',this)">copy</button></div><code id="'+id+'">'+code.trim()+'</code></pre>';
  });
  // Headers
  t=t.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  t=t.replace(/^## (.+)$/gm,'<h2>$1</h2>');
  t=t.replace(/^# (.+)$/gm,'<h1>$1</h1>');
  // Bold
  t=t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  // Inline code
  t=t.replace(/`([^`]+)`/g,'<code>$1</code>');
  // Horizontal rules
  t=t.replace(/^---$/gm,'<hr>');
  // Bullet lists (simple)
  t=t.replace(/^[\-\*] (.+)$/gm,'<li>$1</li>');
  t=t.replace(/(<li>.*<\/li>\n?)+/g,'<ul>$&</ul>');
  // Numbered lists
  t=t.replace(/^\d+\.\s(.+)$/gm,'<li>$1</li>');
  return t;
}

function copyCode(id,btn){
  const el=document.getElementById(id);
  if(!el)return;
  navigator.clipboard.writeText(el.textContent).then(function(){
    btn.textContent='copied!';btn.classList.add('copied');
    setTimeout(function(){btn.textContent='copy';btn.classList.remove('copied');},1500);
  });
}

function cleanPrompt(raw){
  // Strip XML/markdown tags but keep the content readable
  let t=raw;
  // Convert XML tags to readable sections
  t=t.replace(/<(\w+)>/g,function(_,tag){
    const labels={task:'Task',requirements:'Requirements',format:'Output format',
      instructions:'Instructions',context:'Context',verification:'Verification',
      guardrails:'Guardrails',objective:'Objective',output_contract:'Expected output',
      examples:'Examples',constraints:'Constraints'};
    return '\n'+(labels[tag.toLowerCase()]||tag)+': ';
  });
  t=t.replace(/<\/\w+>/g,'');
  // Clean up markdown-style headers
  t=t.replace(/^#+\s*/gm,'');
  // Clean up excessive newlines
  t=t.replace(/\n{3,}/g,'\n\n');
  // Clean up leading whitespace per line
  t=t.replace(/^\s+/gm,function(m){return m.length>4?'  ':m;});
  return t.trim();
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

async function send(){
  const prompt=pi.value.trim();if(!prompt||busy)return;
  busy=true;sb.disabled=true;pi.value='';ar(pi);
  add('<div class="msg mu"><div class="bub">'+esc(prompt)+'</div></div>');
  const id='m'+Date.now();
  add('<div class="msg mb" id="'+id+'"></div>');
  const el=document.getElementById(id);
  try{
    el.innerHTML='<div class="sa" id="sa-'+id+'"><div class="ph"><div class="sp"></div> Analyzing prompt...</div><div class="slots" id="sl-'+id+'"></div></div>';
    cv.scrollTop=cv.scrollHeight;
    const override=os.value||null;
    const aR=await fetch(API+'/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,override_provider:override})});
    if(!aR.ok)throw new Error((await aR.json()).detail||'Analyze failed');
    const a=await aR.json();
    await animSel(id,a);
    const sa=document.getElementById('sa-'+id),ph=sa.querySelector('.ph');
    ph.innerHTML='<div class="sp"></div> <span style="color:'+vcolor(a.selected_vendor)+'">'+a.selected_display_name+'</span> is generating...';
    cv.scrollTop=cv.scrollHeight;
    const gR=await fetch(API+'/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reprompted_prompt:a.reprompted_prompt,provider:a.selected_provider,model_id:a.selected_model_id,original_prompt:prompt,intent:a.intent})});
    if(!gR.ok)throw new Error((await gR.json()).detail||'Generate failed');
    const g=await gR.json();
    const rpId='rp'+Date.now();
    const mc=vcolor(g.vendor||a.selected_vendor);
    el.innerHTML=
      '<div class="trans">'+
        '<span class="bdg intent">'+a.intent.replace(/_/g,' ')+'</span>'+
        '<span style="color:var(--text3);font-size:9px">&#x2192; '+a.benchmark_name+' &#x2192;</span>'+
        '<span class="bdg model" style="background:'+mc+'20;color:'+mc+'">'+g.model_display_name+'</span>'+
        '<span class="bdg score">#'+a.rank+'/'+a.total_candidates+' &middot; '+a.intent_score+'</span>'+
        '<span class="bdg time">'+g.latency_ms+'ms</span>'+
        '<span class="bdg std">'+a.prompt_standard+'</span>'+
        (g.failover_from?'<span class="bdg" style="background:rgba(255,107,107,.1);color:var(--red)">failover from '+g.failover_from+'</span>':'')+
        '<button class="tgl" onclick="document.getElementById(\''+rpId+'\').classList.toggle(\'show\')">&#9656; optimized prompt</button>'+
        '<div class="rp" id="'+rpId+'">'+cleanPrompt(a.reprompted_prompt)+'</div>'+
      '</div>'+
      '<div class="bbot">'+fmt(esc(g.response))+'</div>';
    cv.scrollTop=cv.scrollHeight;checkH();
  }catch(e){el.innerHTML='<div class="err">'+esc(e.message||'Backend error')+'</div>';}
  finally{busy=false;sb.disabled=false;pi.focus();}
}

async function animSel(id,a){
  const sl=document.getElementById('sl-'+id),sa=document.getElementById('sa-'+id),ph=sa.querySelector('.ph');
  const rk=a.all_rankings,win=a.selected_model_id;
  ph.innerHTML='<div class="sp"></div> Intent: <span style="color:var(--accent);font-weight:600">'+a.intent.replace(/_/g,' ')+'</span> &#8212; scanning '+a.benchmark_name+'...';
  await sleep(400);
  ph.innerHTML='<div class="sp"></div> Ranking '+rk.length+' models on <span style="color:var(--green)">'+a.score_category+'</span> benchmarks <span style="color:var(--text3);font-size:9px">(vellum.ai)</span>';
  let sh='';
  for(let i=0;i<rk.length;i++){const r=rk[i],c=vcolor(r.vendor);
    sh+='<div class="slot" id="s-'+id+'-'+i+'"><span class="s-rank">#'+r.rank+'</span><span class="s-name" style="color:'+c+'">'+r.display_name+'</span><div class="s-bar"><div class="s-fill" style="width:0%;background:'+c+'"></div></div><span class="s-score" style="opacity:0">'+r.intent_score+'</span><span class="s-chk">&#x2713;</span></div>';}
  sl.innerHTML=sh;
  for(let i=0;i<rk.length;i++){const s=document.getElementById('s-'+id+'-'+i);s.classList.add('scanning');
    await sleep(80);s.querySelector('.s-fill').style.width=rk[i].intent_score+'%';s.querySelector('.s-score').style.opacity='1';
    await sleep(180);cv.scrollTop=cv.scrollHeight;}
  await sleep(250);
  ph.innerHTML='<div class="sp"></div> Selecting best model...';await sleep(300);
  for(let i=0;i<rk.length;i++){const s=document.getElementById('s-'+id+'-'+i);s.classList.remove('scanning');
    s.classList.add(rk[i].model_id===win?'winner':'rejected');}
  const wc=vcolor(a.selected_vendor);
  ph.innerHTML='&#x2713; <span style="color:'+wc+';font-weight:600">'+a.selected_display_name+'</span> &#8212; '+a.selection_reason;
  const src=document.createElement('div');src.className='bsrc';
  src.innerHTML='Source: <a href="'+a.source_url+'" target="_blank">'+a.data_source+'</a> · Prompt: <span style="color:var(--accent)">'+a.prompt_standard+'</span>';
  sl.after(src);await sleep(350);cv.scrollTop=cv.scrollHeight;
}

async function loadLB(){
  const lv=document.getElementById('lv');
  try{const lb=await(await fetch(API+'/api/leaderboard')).json();
    const cats={code_generation:'Coding',code_review:'Code Review',explanation:'Explanation',creative_writing:'Creative Writing',research:'Research',math_reasoning:'Math',summarization:'Speed / Summary',conversation:'Conversation'};
    let h='<div class="lbh"><div><h2>Model Leaderboard</h2><div class="lbsrc">Source: <a href="'+lb.source_url+'" target="_blank" style="color:var(--accent)">'+lb.source+'</a> · <a href="'+(lb.coding_url||'')+'" target="_blank" style="color:var(--accent)">coding leaderboard</a></div></div><button class="lbr" onclick="loadLB()">&#x21bb; Refresh</button></div>';
    h+='<div class="lbs"><h3>Overall ELO</h3><table class="lt"><tr><th>#</th><th>Model</th><th>Vendor</th><th>ELO</th><th style="width:160px"></th></tr>';
    lb.overall.forEach(function(m,i){var c=vcolor(m.vendor),p=((m.overall_elo-1000)/400*100).toFixed(0);
      h+='<tr><td style="color:var(--text3);font-weight:700">'+(i+1)+'</td><td style="color:'+c+'">'+m.display_name+'</td><td><span class="vpill" style="background:'+c+'18;color:'+c+'">'+m.vendor+'</span></td><td>'+m.overall_elo+'</td><td><div class="lbar"><div class="lbf" style="width:'+p+'%;background:'+c+'"></div></div></td></tr>';});
    h+='</table></div>';
    for(var cat in lb.by_category){var models=lb.by_category[cat];
      h+='<div class="lbs"><h3>'+(cats[cat]||cat)+'</h3><table class="lt"><tr><th>#</th><th>Model</th><th>Vendor</th><th>Score</th><th style="width:160px"></th></tr>';
      models.forEach(function(m){var c=vcolor(m.vendor);
        h+='<tr><td style="color:var(--text3);font-weight:700">'+m.rank+'</td><td style="color:'+c+'">'+m.display_name+'</td><td><span class="vpill" style="background:'+c+'18;color:'+c+'">'+m.vendor+'</span></td><td>'+m.intent_score+'</td><td><div class="lbar"><div class="lbf" style="width:'+m.intent_score+'%;background:'+c+'"></div></div></td></tr>';});
      h+='</table></div>';}
    lv.innerHTML=h;
  }catch(e){lv.innerHTML='<div class="err">Backend not reachable</div>';}
}
</script>
</body>
</html>
